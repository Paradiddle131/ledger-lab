# What the access review reads beside the persona catalogue, the tag readers and the declared
# configuration in platform/gcp: the identities that are not personas, the owner of every identity,
# and the pairs of duties no identity may hold together. `python -m access.review` writes the
# report from these; tests/access/test_review.py checks it. Shape: access/review.schema.json.

# The service accounts platform/gcp declares or references beside the persona accounts, each by
# the address of its declaration there, so a test can hold that no account is left out. Their
# grants are read from platform/gcp, except the roles the owner granted the agent account by hand,
# on the project and on the billing export's cost view, which no file grants and so nothing offline
# checks against the live project; `make cost-check`, run behind the session's proxy, asks the live
# project whether that account holds a permission that moves a spend fence. The owner's login may
# delegate through the agent account (the custom role personaTokenDelegation, holding only
# iam.serviceAccounts.implicitDelegation, also granted by hand), so the persona tests on BigQuery
# run from the owner's machine through it (access/bigquery.py); it cannot mint the agent's own
# token, and it widens no one's reach, since the project's owner can grant themselves any role.
accounts:
  - id: agent
    kind: automation
    declared: data.google_service_account.agent
    duties: The sessions' credential; builds the warehouse models, lands the verified files and acts as any persona in the tests.
    reach: The largest concentration of access in the lab; its declared builder role reads and replaces every table of every warehouse dataset; it reads every tagged column in clear, writes the landing bucket and can act as every persona, its own owner and every other owner among them, and as the publisher; by hand it holds no data role on the project and reads the billing export only through its cost view.
    custom_roles_granted_by_hand:
      - id: labQueryRunner
        title: Runs BigQuery queries
        created: declared
        permissions:
          - bigquery.config.get
          - bigquery.jobs.create
      # The project permissions the fence reads of `make cost-check` need (its READS table): the
      # project and its IAM policy, the BigQuery quota, the budget topic, its subscription, the
      # kill switch's workflow, trigger and account, and billing a read to the project (service
      # usage's use, which replaced the predefined service usage consumer role and its 17 other
      # permissions on 2026-11-22); the budget is read on the billing account.
      # serviceusage.quotas.get is at Google's TESTING support level for custom roles.
      - id: labFenceReader
        title: Reads the lab's spend fences
        created: by hand
        permissions:
          - resourcemanager.projects.get
          - resourcemanager.projects.getIamPolicy
          - pubsub.topics.get
          - pubsub.subscriptions.get
          - workflows.workflows.get
          - eventarc.triggers.get
          - iam.serviceAccounts.get
          - serviceusage.quotas.get
          - serviceusage.services.use
    # The cost query's read of its view: the view and its rows, in place of the predefined data
    # viewer role (which also held the table's IAM policy, export, snapshots and replication).
    custom_table_roles_granted_by_hand:
      - id: labViewReader
        title: Reads the cost view
        created: by hand
        view: the billing export's cost view
        permissions:
          - bigquery.tables.get
          - bigquery.tables.getData
    # Each limit is held by a test, of the access rules in tests/platform or of the hand-granted
    # roles in tests/access/test_review.py, except the last, which says what nothing limits.
    limits:
      - Its declared rights reach only the warehouse datasets, the policy-tag taxonomy and its tags, the landing bucket and the persona accounts, never the project.
      - Its builder role sets no dataset or table access and deletes no dataset; setting a row access policy's grantees is its one access write.
      - It mints tokens on the persona accounts and the publisher only, so it acts as a persona or the publisher and as nobody else, and acting as one it holds that account's grants alone.
      - None of its declared roles holds a permission that moves a spend fence.
      - Its roles granted by hand run jobs, read the cost view and read the fences' configuration; the project-wide ones hold no BigQuery or Cloud Storage permission but running jobs and reading BigQuery's settings, and none of them writes data, sets anyone's access, mints a token or moves a spend fence.
      - Not limited yet, acting as the proposer and the approver it can enter an entry and approve it alone; that ends with the approval workflow, which gives the proposer and the approver identities no one account acts as both of, and refuses an approval from the identity that drafted the entry.
  - id: publisher
    kind: automation
    declared: google_service_account.publisher
    duties: Publishes each governed copy of an entity-scoped product (access/row_policies.py), replacing its rows from its mart in one transaction once its row access policies check out.
    reach: Its row access policy grants it every row of each governed copy, and it reads every mart in the intermediate dataset, so it reads every entity's payments with their tagged columns as the marts hold them.
    limits:
      - It writes only the rows of the governed datasets' tables (its row publisher role reads a table and its data and writes its data), creates and deletes no table and sets no access or row access policy.
      - Its one other dataset grant reads the intermediate dataset, which no persona reads; its one project role runs jobs.
      - It mints no token; only the agent mints its token, so the owner's login reaches it by delegation through the agent account.
  - id: kill-switch
    kind: automation
    declared: google_service_account.kill_switch
    duties: Runs the kill-switch workflow, which unlinks billing from the project once the month's cost passes the kill threshold.
    reach: It can unlink billing from the project, which stops every paid service in it.
    limits:
      - It holds three project roles, for billing, receiving events and invoking workflows, and no grant on any dataset, tag or account, so it reads no data.

# The human persona who answers for each identity's access in a review: confirms that every grant
# is still needed and asks for any change, which the owner of the project applies. The group
# controller owns the control that each persona sees what the catalogue says, so owns the personas'
# access, except its own, which goes to the auditor, who reads everything and changes nothing; the
# agent operator runs the agents, so owns the agent persona and the account they run on; the group
# controller owns the publisher, which writes the rows the personas' visibility rests on, and the
# spend fences, so owns the kill switch. No identity owns itself.
owners:
  accountant-chicago: group-controller
  accountant-uk-transport: group-controller
  accountant-nl-government: group-controller
  group-controller: auditor
  payables-clerk: group-controller
  approver: group-controller
  auditor: group-controller
  metric-owner: group-controller
  agent-operator: group-controller
  proposer: agent-operator
  agent: agent-operator
  publisher: group-controller
  kill-switch: group-controller

# Pairs of duties no identity may hold together, in business words. A pair the grants can state
# names its two sides as a product and an access in access/personas.yaml, and a scope: an identity
# holding both on the same entity (same-entity), or on any entities at all (any-entity), holds the
# conflict. A pair they cannot state says why, and the review reports it as not checkable, never as
# passing. The access review checks each persona's grants against these, and the visibility
# matrix test checks each persona's cells against the same pairs.
conflicts:
  - id: enter-and-approve-entry
    duties: [enter an entry (draft), approve an entry (post)]
    # The issue's "post entry and approve entry": in the lab the maker enters an entry by drafting
    # it and the checker approves it by posting it. Any entity: one who approves entries drafts on
    # no ledger, so no one checks entries in one ledger and makes them in another.
    scope: any-entity
    sides:
      - {product: ledger, access: draft}
      - {product: ledger, access: post}
  - id: create-and-pay-vendor
    duties: [create vendor, pay vendor]
    not_checkable: No grant creates a vendor, since vendors arrive with the landed public records, and none pays one, since the payables clerk reads the payments its duty processes.
  - id: make-and-deploy-change
    duties: [make change, deploy change]
    not_checkable: Editing the metric definitions is a grant, but deploying a change is merging it and applying platform/gcp, rights on the repository and the project that no catalogue records.
  - id: administer-access-and-run-transactions
    duties: [administer access, run transactions]
    not_checkable: Drafting and posting entries are grants, but administering access is changing the catalogues and applying them, which no catalogue records; no persona holds it, and the agent account's row-policy grantees and its tokens for every persona are shown in its section instead.
