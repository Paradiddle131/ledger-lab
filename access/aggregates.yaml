# What a persona with an `aggregate` grant on a data product reads in place of its rows: a fixed set
# of aggregate tables, each at one stated grain, holding only the groups of at least the minimum
# group. The local engine materialises them in the persona's database (access/compile.py), so a
# narrower filter or grain finds no row to sum; BigQuery's twin is an aggregation threshold policy
# on a view at the same grain. Shape: access/aggregates.schema.json.
#
# Each table names its source table (one of the product's `tables` in access/personas.yaml), the
# columns it groups by and sums, and its units: what the minimum counts, always payees. A group
# is kept when its units are at least the minimum. `count_distinct` counts the distinct values of
# a column over the source rows, as BigQuery's threshold counts distinct privacy units; `max`
# takes the largest per-row count of distinct payees the source rows already hold, which is never
# more than the group's distinct payees, so a group it keeps holds at least the minimum.
# `entity_rows` says whether the grain keeps each entity apart: when true the table also groups by
# `entity_group_by` and sums `entity_sum`; when false it gives figures across all entities only.
# No table groups by or sums a tagged column of access/columns.yaml.
# A table of figures across all entities (`entity_rows: false`) also keeps a group only when it
# holds at least `minimum_entities` entities whose rows the persona reads in no product, or reads
# per entity in an aggregate table, and those entities' rows alone hold the minimum group: a
# persona can work out its own entities' share of a group and take it away, so without this a
# group of one other entity, or the group less the persona's own, would be one entity's figure or
# a small group. Such a table shows one translated amount only: the same figures at two sets of
# rates are two equations in the entities' own-currency amounts, which with two entities and the
# public rates split the group between them.
# Differencing two answers of different grains is not stopped here: within one table each row
# counts in one group, and the two group-totals tables sum different figures.

# Ten, a common small-cell threshold, and the one the adversarial cases measure their targets
# against (agent/evals/adversarial.yaml, held equal by a test); BigQuery states it as the policy's
# `threshold`.
minimum_group: 10
# Two: the stricter reading of aggregate access, which is open with the owner. A kept group is then
# the combined figure of at least two entities the persona does not read, which nothing in its
# database splits between them. Its cost on today's data: a reader of Chicago's payments (its
# accountant, the approver) is given no group totals at all, the UK's accountant 2 of the 49 spans
# and the Dutch accountant 12, and no left-out group is given to any of them. One gives the looser
# reading, a group of one other entity's figure as long as its rows hold the minimum; it does not
# give back what aggregate readers had before this rule, since a group of only the reader's own
# entities stays dropped.
minimum_entities: 2

products:
  # The metric owner's payments, by entity and fiscal period: each entity's rows apart, as its
  # grants name entities one by one. The units are distinct payees, the published payee as stored
  # (an organisation's name or a person's keyed hash), since a sum over many payments to one
  # person is that person's: BigQuery's privacy unit column.
  payments:
    entity_rows: true
    tables:
      - name: payments_by_period
        from: payments
        group_by: [currency, fiscal_year, fiscal_period, is_repeat]
        sum: [amount]
        entity_group_by: [entity_id]
        units: {name: payees, count_distinct: vendor_name}
  # What aggregate access to the group totals means is open with the owner: all-entity figures
  # only, or each entity's rows of at least the minimum group. This is the stricter of the two:
  # a span's figures, in euros at constant rates, across every entity, with no entity, basis or
  # own currency in the grain. `entity_rows: true` gives the other reading, each entity's span
  # and basis, with its amount at actual rates too.
  group-totals:
    entity_rows: false
    tables:
      - name: group_totals
        from: group_totals
        group_by: [period_start, period_end, reporting_currency, constant_rates_on]
        # At constant rates, not actual: a constant-rate figure moves with the figures alone, so
        # spans and builds compare, while the actual-rate one also carries the mix of payment days.
        sum: [figures, amount_at_constant_rates]
        entity_group_by:
          - group_total_key
          - entity_id
          - fiscal_year
          - fiscal_period
          - basis
          - currency
        entity_sum: [amount, amount_at_actual_rates]
        units: {name: payees, max: payees}
      - name: group_totals_left_out
        from: group_totals_left_out
        group_by: [fiscal_year, left_out_by]
        sum: [figures]
        entity_group_by: [entity_id, basis, currency]
        entity_sum: [amount]
        units: {name: payees, max: payees}
