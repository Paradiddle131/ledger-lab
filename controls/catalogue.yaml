# The controls catalogue: each control, its owner, what it asserts and the tests that prove it.
# A control is `implemented` only when its tests exist and prove it; one whose tests exist but
# do not prove it yet says what it `awaits`. tests/test_controls.py checks both.
# Shape: controls/schema.json. Owners are persona ids from access/personas.yaml.

layers:
  - Identity and delegation
  - Data access
  - The conversation
  - Injection and tool authorisation
  - Answer integrity
  - Evaluation and monitoring
  - Change management
  - Accountability
  - Cost and abuse
  - Data integrity

controls:
  - id: queries-run-as-the-asker
    layer: Identity and delegation
    owner: agent-operator
    asserts: Every agent query runs on the asking persona's identity, on the local engine and on BigQuery; two personas asking the same question get different rows, and a question without a user identity gets no answer. On BigQuery the persona's token is minted for each connection and SELECT SESSION_USER() must name the persona's account once, before the connection's first query (tests/agent/test_bigquery_mode.py, offline); the agent account itself still holds the warehouse builder role on the built datasets, which the agent's queries never name.
    proven_by:
      - tests/agent/test_ask.py::test_two_personas_asking_the_same_question_get_different_rows
      - tests/agent/test_ask.py::test_a_question_without_a_persona_gets_no_answer
    status: implemented
  - id: no-persona-holds-conflicting-duties
    layer: Identity and delegation
    owner: group-controller
    asserts: "No persona's grants in access/personas.yaml hold both sides of a conflicting pair of duties in access/review.yaml that the grants can state, within the pair's scope; today that is entering an entry (draft) and approving an entry (post), on any ledgers. Three pairs are reported as not checkable, never as passing, since no grant states one of their duties (creating and paying a vendor, making and deploying a change, administering access and running transactions). The agent account, which can act as every persona, holds entering and approving through the proposer and the approver; the access review shows it and the check does not refuse it."
    proven_by:
      - tests/access/test_review.py::test_a_planted_conflict_fails_the_duty_check
      - tests/access/test_review.py::test_no_persona_holds_a_conflicting_pair
    status: implemented
  - id: warehouse-enforces-visibility
    layer: Data access
    owner: group-controller
    asserts: The warehouse, never the prompt, decides what each persona sees; every persona against every entity and sensitive column is clear, masked, aggregate only or denied as access/personas.yaml says.
    proven_by: [tests/access/test_visibility.py::test_every_persona_sees_its_matrix]
    status: not-implemented
    awaits:
      parameter: bigquery
      until_then: "The test passes on the local engine, and its BigQuery parameter runs on the owner's machine (make bigquery-visibility), as each persona's own service account under the warehouse's applied rules, over the 39 of the 120 cells of access/visibility.yaml the landed data holds something for, each of which must match. The other 81 stay proven on the local engine's labelled invented tables only, and the BigQuery run counts and names them as left to the local engine, never as proven: the 50 cells of the ledger, the metric definitions and the audit log (no table built yet, so every edit, draft and post cell), the 20 cells of the two bank tags (no column until the ERP's tables exist), the 10 cells of the Dutch government's payments and its accountant's individual's-id tag cell (no payment rows). It stays not-implemented until those products have tables."
  - id: aggregates-hold-a-minimum-group-across-the-session
    layer: Data access
    owner: group-controller
    asserts: An answer to a persona whose grant on a product is aggregate gives no figure over fewer rows than the minimum group, counted across the session, so neither one answer nor the difference of two answers in a session covers fewer rows than the minimum group.
    proven_by: [tests/agent/test_aggregates.py::test_no_answer_or_difference_isolates_a_small_group]
    status: not-implemented
  - id: individuals-hashed-before-landing
    layer: Data access
    owner: group-controller
    asserts: The pseudonymiser in ingest/individuals.py returns a vendor or payee name in clear only on evidence of a single organisation (a legal form with no second party joined, a known organisation, or a legal-entity register record of a separate legal person with the whole name, for a name not shaped like a person's); it replaces every other name with an HMAC-SHA-256 keyed from the environment, gives two people two hashes, and refuses to start without the key.
    proven_by:
      - tests/ingest/test_individuals.py::test_only_organisations_leave_in_clear
      - tests/ingest/test_entities.py::test_a_register_record_with_a_persons_exact_name_never_vouches
      - tests/ingest/test_entities.py::test_nothing_else_is_vouched_for
      - tests/ingest/test_entities.py::test_a_vouched_organisation_lands_in_clear_with_what_describes_it
      - tests/ingest/test_chicago_set.py::test_a_payee_hashed_in_payments_blanks_a_contract_description_naming_them
      - tests/ingest/test_uk_transport_spend.py::test_a_supplier_the_register_vouches_for_lands_in_clear_and_a_person_stays_hashed
    status: implemented
  - id: one-person-one-session
    layer: The conversation
    owner: agent-operator
    asserts: "The own agent asked in a session shows its model, on every step but the planning one, the earlier exchanges of that session only, read by session and persona together, and a persona naming a session that is not theirs, or an id no session can have, reads none of it: the turn is recorded refused for foreign-session under a session id the agent makes, never the one given, before any model step or connection. The retention is 30 days. The purge command refuses a log that does not exist, a log whose chain does not verify and, for a log holding a record, a folder of kept values that does not exist, is a link or is open to others, before it removes anything; otherwise it removes every transcript exchange that ended, and every session with none left that started, more than 30 days before it ran, keeps younger ones, and removes the audit log's kept values and salts of the records older than that, with those of an approval whose proposal's go, while every record line stays and the chain verifies. A personal value planted in a question, asked with or without a session, given as the persona, or given as the session id, is in neither the audit log's lines nor any Python log record, nor the process's standard output or error in a session."
    proven_by:
      - tests/agent/test_sessions.py::test_no_cross_session_recall
      - tests/agent/test_sessions.py::test_the_purge_command_removes_expired_transcripts_and_keeps_young_ones
      - tests/agent/test_sessions.py::test_a_purge_removes_an_approvals_kept_draft_with_its_proposal
      - tests/agent/test_sessions.py::test_a_planted_personal_value_never_reaches_the_logs
      - tests/agent/test_sessions.py::test_a_planted_personal_value_asked_in_a_session_never_reaches_the_logs
      - tests/agent/test_sessions.py::test_the_retention_is_thirty_days
      - tests/agent/test_sessions.py::test_a_purge_refused_by_the_log_leaves_the_transcripts
      - tests/agent/test_sessions.py::test_the_log_purge_refuses_a_missing_log_a_missing_folder_and_a_broken_chain
      - tests/agent/test_sessions.py::test_the_log_purge_refuses_a_folder_of_kept_values_open_to_others_or_a_link
    status: implemented
  - id: untrusted-content-cannot-instruct
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: The own agent's model plans its tool calls on a turn holding the question and the verified queries only, and a call it then makes that is not in the plan is refused and not put to the tool policy; an instruction planted in a cell of the persona's database, a column description or a glossary entry passed to the agent, read by a test model that obeys it, to call a tool the policy does not declare, the write tool, a query the metric context lacks, a verified query the asking persona may run, or the question's own query once more, comes back refused as unplanned, and the queries run, with the metric, version, SQL, columns and rows each cites (the planted cell put back), and the turn's audit record equal those of the same question asked with nothing planted; so do three planted calls in one glossary entry, and twenty across a glossary entry, a column description and a cell or all in a cell, where after five refused calls the agent asks the model no more and runs the planned query itself; the text of the reply is not checked.
    proven_by:
      - tests/agent/test_injection.py::test_planted_instructions_are_ignored
      - tests/agent/test_injection.py::test_three_planted_calls_leave_the_questions_query_to_run
      - tests/agent/test_injection.py::test_more_planted_calls_than_the_refusal_limit_leave_the_questions_query_to_run
    status: implemented
  - id: no-outbound-channel-carries-data
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: An answer holds no link or image to an address outside the lab, and the agent sends no request but to the warehouse and its model, so no address an untrusted value or definition asks it to build carries data out.
    proven_by: [tests/agent/test_exfiltration.py::test_no_link_image_or_request_carries_data_out]
    status: not-implemented
  - id: answers-cite-and-re-execute
    layer: Answer integrity
    owner: metric-owner
    asserts: >-
      What is checked (agent/integrity.py, applied by agent/ask.py when the model replies on a turn stopped at no cap): the model writes no digit; it writes a reference to a cited cell, {query:row:column}, and the text shown and recorded is its reply with each reference replaced by that cell's rendering, so the text a reader sees is the text the record seals.
      The reply is shown, and the turn recorded answered, only when a cited query's verified question equals the asked question after NFKC, casefolding and white-space collapsing, the reply holds more than white space, and each reference names a query cited exactly once in the turn by a run that covers the question and carries a freshness, a row that run returned and a column it returned once; otherwise a fixed text with no digit is shown and recorded in its place and the turn is not recorded answered (it is recorded abstained, or refused for the policy or as unplanned when a call was), which includes a turn that cites no run, whatever its reply says.
      Withheld too: outside its references, any character but an ASCII letter, a space, a line break, one of . , ; : ! ? ' " = _, or a - between two ASCII letters, so any digit, any character outside ASCII (each Unicode digit, numeral, letter that folds to a digit under NFKC, look-alike letter, format character and bidi control), every other ASCII symbol, a brace outside a whole reference and every other control character; a reference not written whole by the grammar, with anything but a space, a line break or the start right before it, or anything but the end, a space, a line break or one of . , ; : ! ? then one of those right after it; two references with no ASCII letter of the model's text between them; a prose word that, with the punctuation at its two ends removed, holds only the letters O o l I S Z B, . and , and that holds a . or , between two of its letters or is the word right before or after a reference; a cell the renderer does not write; and an exception raised by the check.
      Each cell is rendered in one fixed format: a number positionally, every digit it carries kept and none rounded, with no thousands separator and no exponent, an ASCII minus below zero and no sign at zero, negative zero included; a NaN, an infinity or a number past 64 characters is not rendered; a null as null, a bool as true or false, a date or time as its ISO text, and a text cell as its own text when it is non-empty printable ASCII with no brace and at most 200 characters.
      Re-running the query a record logged, as the record's persona and only when its persona, SQL and bound values are the answer's and the cited query's, in the citations' order, must give the cited run's columns and rows, in any order, and the record's sealed result.
      Stated limits: the words around a reference are prose that is not read, so a sign, direction or scale in words (minus, a net-loss of, down about, in millions, USD million) is shown beside the cell's own figure and can tell a reader a positive cell is a loss or a cell is in thousands; a figure written in words (forty-two thousand) is prose and shown; a word that rule does not withhold is shown, beside a reference or not: for example a word with another character inside it (lO'OOO, OO-OO), or one with no . or , between two of its letters that is not beside a reference (lOO thousand, .OS); and an honest word of those letters beside a reference (I) is withheld; which row, column or metric the prose attributes a rendered figure to is not checked, so swapped references are shown; a text cell's own characters are not read, so a text cell holding digits or a sign shows them; a reply of prose with no reference is shown on a covering run; a BigQuery citation carries no freshness, so on BigQuery every reply that references a cell is withheld and only prose is shown; an honest reply that writes a figure itself, a currency or percent sign, Markdown, parentheses or a non-ASCII letter is withheld, and so is one naming a query cited twice in the turn; a paraphrase of a verified question is withheld, so the agent answers only the verified questions' own wording; the re-run reads whatever database the connection-maker opens and is a verifier's call, not made by ask; a turn stopped at a query's cap, the tool-call cap or the refusal cap shows ask's own fixed message, which names the cap and is not checked; a turn at the refusal cap is not checked and is recorded answered when a planned call returned.
    proven_by:
      - tests/agent/test_answer_integrity.py::test_logged_query_reproduces_the_answer
      - tests/agent/test_answer_integrity.py::test_a_perturbed_number_in_a_scripted_answer_is_caught
      - tests/agent/test_answer_integrity.py::test_each_figure_of_a_many_row_answer_written_by_the_model_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_changed_warehouse_is_caught_on_re_run
      - tests/agent/test_answer_integrity.py::test_a_question_outside_the_metrics_gets_an_abstention
      - tests/agent/test_answer_integrity.py::test_only_a_verified_question_as_worded_is_answered
      - tests/agent/test_answer_integrity.py::test_a_reply_with_no_cited_run_is_withheld_whatever_it_says
      - tests/agent/test_answer_integrity.py::test_a_turn_stopped_at_the_cap_shows_its_own_message
      - tests/agent/test_answer_integrity.py::test_a_reply_the_check_cannot_read_is_withheld_and_recorded
      - tests/agent/test_answer_integrity.py::test_an_empty_reply_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_bidi_control_around_a_figure_is_withheld
      - tests/agent/test_answer_integrity.py::test_the_text_shown_is_the_text_recorded
      - tests/agent/test_answer_integrity.py::test_a_non_ascii_look_alike_of_a_digit_or_a_minus_is_withheld
      - tests/agent/test_answer_integrity.py::test_no_character_outside_ascii_passes_in_the_prose
      - tests/agent/test_answer_integrity.py::test_a_sign_word_beside_a_figure_the_model_writes_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_sign_word_beside_a_reference_shows_the_cells_own_sign
      - tests/agent/test_answer_integrity.py::test_a_scale_word_beside_a_figure_the_model_writes_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_scale_word_beside_a_reference_shows_the_cells_own_figure
      - tests/agent/test_answer_integrity.py::test_two_figures_with_no_letter_between_are_withheld
      - tests/agent/test_answer_integrity.py::test_a_word_of_digit_shaped_letters_with_a_point_or_beside_a_reference_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_word_the_look_alike_rule_does_not_withhold_is_shown
      - tests/agent/test_answer_integrity.py::test_an_honest_word_of_digit_shaped_letters_beside_a_reference_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_sign_form_around_a_figure_the_model_writes_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_sign_form_around_a_reference_is_withheld_or_shows_the_cell
      - tests/agent/test_answer_integrity.py::test_a_cell_is_rendered_in_one_fixed_format
      - tests/agent/test_answer_integrity.py::test_a_cell_the_renderer_does_not_write_withholds_the_reply
      - tests/agent/test_answer_integrity.py::test_a_malformed_reference_is_withheld_and_nothing_of_it_rendered
      - tests/agent/test_answer_integrity.py::test_a_character_touching_a_reference_is_withheld
      - tests/agent/test_answer_integrity.py::test_prose_holds_a_hyphen_only_between_two_letters
      - tests/agent/test_answer_integrity.py::test_a_reference_names_one_run_of_this_turn_one_row_and_one_column
      - tests/agent/test_answer_integrity.py::test_check_needs_a_covering_run_with_a_freshness_for_each_reference
      - tests/agent/test_answer_integrity.py::test_a_figure_from_a_run_that_does_not_cover_the_question_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_number_with_no_cited_run_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_figure_the_model_writes_itself_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_re_run_that_does_not_reproduce_is_reported
      - tests/agent/test_answer_integrity.py::test_a_run_logged_unlike_its_citation_is_not_re_run
      - tests/agent/test_answer_integrity.py::test_the_re_run_is_made_as_the_logged_persona
      - tests/agent/test_answer_integrity.py::test_runs_are_compared_with_citations_in_order
      - tests/agent/test_answer_integrity.py::test_a_withheld_reply_keeps_the_refusal_the_turn_records
      - tests/agent/test_bigquery_mode.py::test_on_bigquery_the_text_shown_is_the_text_recorded_and_a_figure_needs_a_freshness
    status: implemented
  - id: scored-by-execution
    layer: Evaluation and monitoring
    owner: metric-owner
    asserts: The scorer (agent/evals/score.py) scores each answer to the golden set (agent/evals/golden.yaml) by running the SQL its citations name again on the asking persona's connection and comparing what it returns with the result frozen there, so an answer whose text and reported rows hold the expected figure while its cited SQL returns another scores wrong; on the sample build the committed metric context scores every case right, and two metric definitions changed in a copy of the context (the duplicate amount rate taken by rows, constant-currency spend kept across bases) score exactly the cases they change wrong-and-sure, which its report names with exit status 1.
    proven_by:
      - tests/agent/test_evaluation.py::test_metric_change_shows_as_drift
      - tests/agent/test_evaluation.py::test_the_score_comes_from_running_the_cited_sql
    status: implemented
  - id: landed-file-breaks-fail-its-quality-suite
    layer: Evaluation and monitoring
    owner: group-controller
    asserts: python -m ingest.quality <source> runs the landed file's GX Core suite and exits non-zero when the file breaks its schema, has a null key, holds a value out of its range or moves a known-mess count from the value measured on the pinned file; each suite passes on a fixture of its source and fails on that fixture with one planted break of each kind; and a broken rule on a column that can hold a name reports a count, never the name.
    proven_by:
      - tests/ingest/test_quality.py::test_each_suite_passes_on_its_fixture
      - tests/ingest/test_quality.py::test_each_suite_fails_on_its_fixture_with_one_planted_break
      - tests/ingest/test_quality.py::test_the_command_exits_non_zero_on_a_break_and_names_each_landed_file_of_a_set
      - tests/ingest/test_quality.py::test_a_break_in_a_name_column_reports_counts_and_never_the_name
      - tests/ingest/test_quality.py::test_a_column_that_can_hold_a_name_carries_only_rules_whose_result_is_a_count
    status: implemented
  - id: release-ships-as-one-unit
    layer: Change management
    owner: approver
    asserts: Prompt, model, tools and metric definitions ship and roll back together, and a failed gate blocks the release.
    proven_by: [tests/operations/test_release.py::test_failed_gate_blocks_release]
    status: not-implemented
  - id: breaking-contract-change-stopped
    layer: Change management
    owner: group-controller
    asserts: A breaking change needs a new major version and a stated reason. make check fails when a data contract in the working tree, matched by contract id with the one on origin/main wherever its file sits, holds a change the Data Contract CLI's breaking comparison grades as an error (among them a column removed or renamed, a type changed, a column made nullable, a key or uniqueness dropped, an accepted value added, a bound loosened, a quality rule removed) or a quality rule of origin/main's gone or changed beyond its wording, unless both versions are MAJOR.MINOR.PATCH, the contract's major number is above origin/main's and its breakingChanges custom property lists exactly the breaks found, each with a reason; a break not listed, a listed break that did not happen, a break listed without a reason or twice, and a break under a major version that did not go up each fail, and since the list is compared with origin/main's contract, a list already merged excuses no later break. While origin/main holds a contract, these fail regardless of the version, in a working-tree contract, new ones included, a shape the gate cannot compare by normalised table and column (a name it cannot normalise, two schema entries of one name or over one table, two properties of one schema of one name or over one column, nested properties or items, two quality rules read under one key anywhere in the contract, that is one place, a schema entry or a schema entry's property, and one id, or one place and one position in their lists for rules with no id); a property over a column origin/main classifies personal without that classification; a property whose schema entry describes a table origin/main describes under another contract id or schema name, or a property over a column origin/main describes under another property name; a column origin/main classifies personal that the tree no longer describes in a change that adds a column not classified personal; a schema name of origin/main's contract gone from it; a contract of origin/main whose id the tree no longer holds, a contract file YAML cannot read or whose id is missing or not text, two files with one id, and a matched contract the CLI cannot read; and the gate fails when origin/main is not in the clone, git cannot read its contracts, or one of them has no id or an id that is not text. As limits, while origin/main holds no contract the gate passes without comparing anything; the rule on a table origin/main describes reads properties, so a schema entry with no properties over such a table is not refused by it; contracts on origin/main are read leniently, so a shape refused here that reached origin/main fails each change that keeps it; and the gate reads contracts, not data, so a classification lost across two changes (an unclassified column added, then the personal one removed) or a column copied under a new physical name in the models is outside it, covered by review of the contract with the masking tags and by the tests that hold the contract equal to the dbt project.
    proven_by:
      - tests/models/test_payments_contract.py::test_a_breaking_change_fails_the_gate
      - tests/models/test_payments_contract.py::test_the_gate_matches_contracts_by_id_wherever_they_are
      - tests/models/test_payments_contract.py::test_a_clone_without_main_fails_and_says_how_to_fetch_it
      - tests/models/test_contract_gate.py::test_a_new_major_version_listing_exactly_its_breaks_passes
      - tests/models/test_contract_gate.py::test_a_break_fails_unless_a_new_major_version_lists_exactly_it_with_a_reason
      - tests/models/test_contract_gate.py::test_a_break_under_the_same_major_version_fails_as_before
      - tests/models/test_contract_gate.py::test_a_merged_major_versions_list_excuses_no_later_break
      - tests/models/test_contract_gate.py::test_no_version_passes_a_shape_the_gate_cannot_compare_or_a_personal_column_unclassified
      - tests/models/test_contract_gate.py::test_a_refusal_listed_verbatim_still_fails
      - tests/models/test_contract_gate.py::test_the_rules_hold_across_the_contracts_of_the_tree_new_ones_included
      - tests/models/test_contract_gate.py::test_a_published_contract_of_two_schemas_over_one_table_fails_until_fixed
      - tests/models/test_contract_gate.py::test_a_contract_at_a_path_git_quotes_is_compared
      - tests/models/test_contract_gate.py::test_no_version_declares_a_contract_gone_or_doubled
      - tests/models/test_contract_gate.py::test_no_version_declares_an_unreadable_contract
      - tests/models/test_contract_gate.py::test_a_working_tree_contract_without_a_text_id_fails_the_gate
      - tests/models/test_contract_gate.py::test_an_origin_main_contract_without_a_text_id_stops_the_gate
      - tests/models/test_contract_gate.py::test_a_schema_rename_hides_no_break_and_in_place_each_needs_its_line
      - tests/models/test_contract_gate.py::test_a_base_git_cannot_read_fails_the_gate
      - tests/models/test_contract_gate.py::test_main_returns_failure_on_a_break_or_when_it_cannot_compare
      - tests/models/test_contract_gate.py::test_the_gate_script_exits_with_failure_on_a_break
    status: implemented
  - id: metric-definition-changes-only-under-a-new-version
    layer: Change management
    owner: metric-owner
    asserts: make check fails when a MetricFlow metric's definition differs from origin/main's under the same version. Each tree is parsed by dbt on the local target (the working tree also on BigQuery profiles, offline, which fails it when a node lands off the routing), origin/main read from git's objects as stored, so export attributes cannot leave a file out or rewrite one, and the working tree's tracked and new files, each limited to the dbt project folder and the folders its project file names. A definition is the metric's own entry of the semantic manifest dbt writes but its version and owner, the metrics it is built from transitively with those its filters read, the measures and semantic models it resolves to and those joined through a shared entity, the time spines, and the project file's vars; so a metric moved to another folder dbt reads, an old copy hidden by .dbtignore beside a changed one, metrics turned off in the project file, a moved time spine, a changed var or a metric on a model's own entry cannot hide a change. It also fails when a version goes down, is missing or is not an integer from 1 to 2^53 - 1, when a metric has no owner, when a metric origin/main defines is gone or renamed, when dbt Jinja sits where dbt renders it in a semantic model or metric entry or in the entry of a model, seed or snapshot a semantic model reads or a time spine is, when the project file holds Jinja or a path setting that is absolute or outside the tree, when what dbt reads holds a symbolic link or a submodule, when a tree declares dbt packages, when the project defines a macro named generate_alias_name, generate_schema_name or generate_database_name or one of those after a <prefix>__ (such as default__generate_alias_name or duckdb__generate_schema_name, which dbt's own versions dispatch to) but the one generate_schema_name whose text is the gate's own, when the project file sets a dispatch entry for the dbt macro namespace, when Jinja in a file of the project dbt parse