# The controls catalogue: each control, its owner, what it asserts and the tests that prove it.
# A control is `implemented` only when its tests exist and prove it; one whose tests exist but
# do not prove it yet says what it `awaits`. tests/test_controls.py checks both.
# Shape: controls/schema.json. Owners are persona ids from access/personas.yaml.

layers:
  - Identity and delegation
  - Data access
  - The conversation
  - Injection and tool authorisation
  - Answer integrity
  - Evaluation and monitoring
  - Change management
  - Accountability
  - Cost and abuse
  - Data integrity

controls:
  - id: queries-run-as-the-asker
    layer: Identity and delegation
    owner: agent-operator
    asserts: Every agent query runs on the asking persona's identity; two personas asking the same question get different rows, and a question without a user identity gets no answer.
    proven_by: [tests/agent/test_identity.py::test_two_personas_same_question_different_rows]
    status: not-implemented
  - id: no-persona-holds-conflicting-duties
    layer: Identity and delegation
    owner: group-controller
    asserts: "No persona's grants in access/personas.yaml hold both sides of a conflicting pair of duties in access/review.yaml that the grants can state, within the pair's scope; today that is entering an entry (draft) and approving an entry (post), on any ledgers. Three pairs are reported as not checkable, never as passing, since no grant states one of their duties (creating and paying a vendor, making and deploying a change, administering access and running transactions). The agent account, which can act as every persona, holds entering and approving through the proposer and the approver; the access review shows it and the check does not refuse it."
    proven_by:
      - tests/access/test_review.py::test_a_planted_conflict_fails_the_duty_check
      - tests/access/test_review.py::test_no_persona_holds_a_conflicting_pair
    status: implemented
  - id: warehouse-enforces-visibility
    layer: Data access
    owner: group-controller
    asserts: The warehouse, never the prompt, decides what each persona sees; every persona against every entity and sensitive column is clear, masked, aggregate only or denied as access/personas.yaml says.
    proven_by: [tests/access/test_visibility.py::test_every_persona_sees_its_matrix]
    status: not-implemented
    awaits:
      parameter: bigquery
      until_then: "The test passes on the local engine only, and there 81 of the 120 cells of access/visibility.yaml are proven on labelled invented tables only, not on the landed data: every cell of the ledger, the metric definitions and the audit log (no table built yet, so every edit, draft and post cell), both bank tags (no column until the ERP's tables exist), and every cell of the Dutch government's payments and its accountant's individual's-id tag (no payment rows); 39 are proven on the landed build. BigQuery, whose own rules decide, is skipped."
  - id: aggregates-hold-a-minimum-group-across-the-session
    layer: Data access
    owner: group-controller
    asserts: An answer to a persona whose grant on a product is aggregate gives no figure over fewer rows than the minimum group, counted across the session, so neither one answer nor the difference of two answers in a session covers fewer rows than the minimum group.
    proven_by: [tests/agent/test_aggregates.py::test_no_answer_or_difference_isolates_a_small_group]
    status: not-implemented
  - id: individuals-hashed-before-landing
    layer: Data access
    owner: group-controller
    asserts: The pseudonymiser in ingest/individuals.py returns a vendor or payee name in clear only on evidence of a single organisation (a legal form with no second party joined, a known organisation, or a legal-entity register record of a separate legal person with the whole name, for a name not shaped like a person's); it replaces every other name with an HMAC-SHA-256 keyed from the environment, gives two people two hashes, and refuses to start without the key.
    proven_by:
      - tests/ingest/test_individuals.py::test_only_organisations_leave_in_clear
      - tests/ingest/test_entities.py::test_a_register_record_with_a_persons_exact_name_never_vouches
      - tests/ingest/test_entities.py::test_nothing_else_is_vouched_for
      - tests/ingest/test_entities.py::test_a_vouched_organisation_lands_in_clear_with_what_describes_it
      - tests/ingest/test_chicago_set.py::test_a_payee_hashed_in_payments_blanks_a_contract_description_naming_them
      - tests/ingest/test_uk_transport_spend.py::test_a_supplier_the_register_vouches_for_lands_in_clear_and_a_person_stays_hashed
    status: implemented
  - id: one-person-one-session
    layer: The conversation
    owner: agent-operator
    asserts: No answer recalls another session, and the purge removes transcripts past their retention.
    proven_by: [tests/agent/test_sessions.py::test_no_cross_session_recall]
    status: not-implemented
  - id: untrusted-content-cannot-instruct
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: An instruction planted in a cell, a column description or a glossary entry changes no tool call; tools are read-only and denied by default.
    proven_by: [tests/agent/test_injection.py::test_planted_instructions_are_ignored]
    status: not-implemented
  - id: no-outbound-channel-carries-data
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: An answer holds no link or image to an address outside the lab, and the agent sends no request but to the warehouse and its model, so no address an untrusted value or definition asks it to build carries data out.
    proven_by: [tests/agent/test_exfiltration.py::test_no_link_image_or_request_carries_data_out]
    status: not-implemented
  - id: answers-cite-and-re-execute
    layer: Answer integrity
    owner: metric-owner
    asserts: Every number in an answer cites its metric version, query and freshness, and re-running the logged query returns it.
    proven_by: [tests/agent/test_answer_integrity.py::test_logged_query_reproduces_the_answer]
    status: not-implemented
  - id: scored-by-execution
    layer: Evaluation and monitoring
    owner: metric-owner
    asserts: Answers are scored by executing their queries against a golden set, and a metric change that moves the score is reported.
    proven_by: [tests/agent/test_evaluation.py::test_metric_change_shows_as_drift]
    status: not-implemented
  - id: landed-file-breaks-fail-its-quality-suite
    layer: Evaluation and monitoring
    owner: group-controller
    asserts: python -m ingest.quality <source> runs the landed file's GX Core suite and exits non-zero when the file breaks its schema, has a null key, holds a value out of its range or moves a known-mess count from the value measured on the pinned file; each suite passes on a fixture of its source and fails on that fixture with one planted break of each kind; and a broken rule on a column that can hold a name reports a count, never the name.
    proven_by:
      - tests/ingest/test_quality.py::test_each_suite_passes_on_its_fixture
      - tests/ingest/test_quality.py::test_each_suite_fails_on_its_fixture_with_one_planted_break
      - tests/ingest/test_quality.py::test_the_command_exits_non_zero_on_a_break_and_names_each_landed_file_of_a_set
      - tests/ingest/test_quality.py::test_a_break_in_a_name_column_reports_counts_and_never_the_name
      - tests/ingest/test_quality.py::test_a_column_that_can_hold_a_name_carries_only_rules_whose_result_is_a_count
    status: implemented
  - id: release-ships-as-one-unit
    layer: Change management
    owner: approver
    asserts: Prompt, model, tools and metric definitions ship and roll back together, and a failed gate blocks the release.
    proven_by: [tests/operations/test_release.py::test_failed_gate_blocks_release]
    status: not-implemented
  - id: breaking-contract-change-stopped
    layer: Change management
    owner: group-controller
    asserts: A breaking change needs a new major version and a stated reason. make check fails when a data contract in the working tree, matched by contract id with the one on origin/main wherever its file sits, holds a change the Data Contract CLI's breaking comparison grades as an error (among them a column removed or renamed, a type changed, a column made nullable, a key or uniqueness dropped, an accepted value added, a bound loosened, a quality rule removed) or a quality rule of origin/main's gone or changed beyond its wording, unless both versions are MAJOR.MINOR.PATCH, the contract's major number is above origin/main's and its breakingChanges custom property lists exactly the breaks found, each with a reason; a break not listed, a listed break that did not happen, a break listed without a reason or twice, and a break under a major version that did not go up each fail, and since the list is compared with origin/main's contract, a list already merged excuses no later break. While origin/main holds a contract, these fail regardless of the version, in a working-tree contract, new ones included, a shape the gate cannot compare by normalised table and column (a name it cannot normalise, two schema entries of one name or over one table, two properties of one schema of one name or over one column, nested properties or items); a property over a column origin/main classifies personal without that classification; a property whose schema entry describes a table origin/main describes under another contract id or schema name, or a property over a column origin/main describes under another property name; a column origin/main classifies personal that the tree no longer describes in a change that adds a column not classified personal; a schema name of origin/main's contract gone from it; a contract of origin/main whose id the tree no longer holds, a contract file YAML cannot read or whose id is missing or not text, two files with one id, and a matched contract the CLI cannot read; and the gate fails when origin/main is not in the clone, git cannot read its contracts, or one of them has no id or an id that is not text. As limits, while origin/main holds no contract the gate passes without comparing anything; the rule on a table origin/main describes reads properties, so a schema entry with no properties over such a table is not refused by it; contracts on origin/main are read leniently, so a shape refused here that reached origin/main fails each change that keeps it; and the gate reads contracts, not data, so a classification lost across two changes (an unclassified column added, then the personal one removed) or a column copied under a new physical name in the models is outside it, covered by review of the contract with the masking tags and by the tests that hold the contract equal to the dbt project.
    proven_by:
      - tests/models/test_payments_contract.py::test_a_breaking_change_fails_the_gate
      - tests/models/test_payments_contract.py::test_the_gate_matches_contracts_by_id_wherever_they_are
      - tests/models/test_payments_contract.py::test_a_clone_without_main_fails_and_says_how_to_fetch_it
      - tests/models/test_contract_gate.py::test_a_new_major_version_listing_exactly_its_breaks_passes
      - tests/models/test_contract_gate.py::test_a_break_fails_unless_a_new_major_version_lists_exactly_it_with_a_reason
      - tests/models/test_contract_gate.py::test_a_break_under_the_same_major_version_fails_as_before
      - tests/models/test_contract_gate.py::test_a_merged_major_versions_list_excuses_no_later_break
      - tests/models/test_contract_gate.py::test_no_version_passes_a_shape_the_gate_cannot_compare_or_a_personal_column_unclassified
      - tests/models/test_contract_gate.py::test_a_refusal_listed_verbatim_still_fails
      - tests/models/test_contract_gate.py::test_the_rules_hold_across_the_contracts_of_the_tree_new_ones_included
      - tests/models/test_contract_gate.py::test_a_published_contract_of_two_schemas_over_one_table_fails_until_fixed
      - tests/models/test_contract_gate.py::test_a_contract_at_a_path_git_quotes_is_compared
      - tests/models/test_contract_gate.py::test_no_version_declares_a_contract_gone_or_doubled
      - tests/models/test_contract_gate.py::test_no_version_declares_an_unreadable_contract
      - tests/models/test_contract_gate.py::test_a_working_tree_contract_without_a_text_id_fails_the_gate
      - tests/models/test_contract_gate.py::test_an_origin_main_contract_without_a_text_id_stops_the_gate
      - tests/models/test_contract_gate.py::test_a_schema_rename_hides_no_break_and_in_place_each_needs_its_line
      - tests/models/test_contract_gate.py::test_a_base_git_cannot_read_fails_the_gate
    status: implemented
  - id: metric-definition-changes-only-under-a-new-version
    layer: Change management
    owner: metric-owner
    asserts: make check fails when a MetricFlow metric's definition differs from origin/main's under the same version. Each tree is parsed by dbt on the local target, origin/main read from git's objects as stored, so export attributes cannot leave a file out or rewrite one, and the working tree's tracked and new files, each limited to the dbt project folder and the folders its project file names. A definition is the metric's own entry of the semantic manifest dbt writes but its version and owner, the metrics it is built from transitively with those its filters read, the measures and semantic models it resolves to and those joined through a shared entity, the time spines, and the project file's vars; so a metric moved to another folder dbt reads, an old copy hidden by .dbtignore beside a changed one, metrics turned off in the project file, a moved time spine, a changed var or a metric on a model's own entry cannot hide a change. It also fails when a version goes down, is missing or is not an integer from 1 to 2^53 - 1, when a metric has no owner, when a metric origin/main defines is gone or renamed, when dbt Jinja sits where dbt renders it in a semantic model or metric entry or in the entry of a model, seed or snapshot a semantic model reads or a time spine is, when the project file holds Jinja or a path setting that is absolute or outside the tree, when what dbt reads holds a symbolic link or a submodule, when a tree declares dbt packages, when the project defines a macro named generate_alias_name, generate_schema_name or generate_database_name or one of those after a <prefix>__ (such as default__generate_alias_name or duckdb__generate_schema_name, which dbt's own versions dispatch to), when the project file sets a dispatch entry for the dbt macro namespace, when git cannot list origin/main's tree or read its files or dbt cannot parse a tree (its message naming no dbt output), when origin/main is not in the clone, and when HEAD does not contain origin/main, so of two branches bumping one metric to the same version the second must merge the first. Outside the comparison are model SQL, command-line vars, relation names decided by the profile, a model's SQL config() or another target, a macro dbt calls only when it runs models (such as generate_latest_version_pointer_alias), and a stale origin/main, which cannot be told apart offline.
    proven_by:
      - tests/semantics/test_metric_versions.py::test_a_changed_definition_under_the_same_version_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_git_attributes_cannot_hide_a_change_on_main
      - tests/semantics/test_metric_versions.py::test_a_project_var_is_part_of_every_definition
      - tests/semantics/test_metric_versions.py::test_project_vars_changed_with_every_version_bumped_pass
      - tests/semantics/test_metric_versions.py::test_a_metric_read_in_a_filter_is_part_of_the_definition
      - tests/semantics/test_metric_versions.py::test_a_metric_on_a_model_entry_is_compared_too
      - tests/semantics/test_metric_versions.py::test_a_definition_dbt_reads_otherwise_or_cannot_read_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_a_metric_reading_a_dbt_var_fails_even_when_only_the_var_changes
      - tests/semantics/test_metric_versions.py::test_a_link_or_a_path_outside_the_tree_fails_the_gate_and_is_not_echoed
      - tests/semantics/test_metric_versions.py::test_only_what_dbt_reads_is_exported_and_judged
      - tests/semantics/test_metric_versions.py::test_a_link_or_submodule_dbt_would_read_fails_on_either_tree
      - tests/semantics/test_metric_versions.py::test_dbt_jinja_is_refused_where_dbt_renders_it
      - tests/semantics/test_metric_versions.py::test_the_macros_and_dispatch_entries_that_decide_relation_names_are_told_apart
      - tests/semantics/test_metric_versions.py::test_a_change_reaches_every_metric_built_on_it
      - tests/semantics/test_metric_versions.py::test_a_metric_without_a_version_an_owner_or_its_promise_fails_the_comparison
      - tests/semantics/test_metric_versions.py::test_a_version_that_goes_down_fails_the_comparison
      - tests/semantics/test_metric_versions.py::test_a_change_that_keeps_every_version_passes_the_gate
      - tests/semantics/test_metric_versions.py::test_a_clone_without_main_fails_and_says_how_to_fetch_it
      - tests/semantics/test_metric_versions.py::test_a_main_whose_project_cannot_be_parsed_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_a_main_git_cannot_read_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_a_main_whose_tree_git_cannot_list_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_a_main_declaring_packages_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_two_branches_publishing_one_version_cannot_both_pass
      - tests/semantics/test_metric_versions.py::test_the_command_exits_non_zero_on_a_break_and_zero_without
      - tests/semantics/test_metric_versions.py::test_a_terminated_run_leaves_no_copy_behind
    status: implemented
  - id: unowned-metric-cannot-ship
    layer: Accountability
    owner: metric-owner
    asserts: make check fails when any MetricFlow metric in semantics/metricflow/, the inputs of a ratio or derived metric included, has no owner in its config meta, an owner that is no persona of access/personas.yaml, is an agent persona or is not the owner of the metric's glossary term, no glossary term or one semantics/glossary.yaml lacks, or no role (headline or input); each case is planted in a metric's own YAML and read back through dbt's parse, as make check reads the real definitions.
    proven_by:
      - tests/semantics/test_metrics.py::test_every_metric_has_a_human_owner_and_a_glossary_term
      - tests/semantics/test_metrics.py::test_a_metric_without_a_human_owner_or_a_known_term_is_refused
    status: implemented
  - id: answer-rebuilt-from-audit
    layer: Accountability
    owner: group-controller
    asserts: One answer can be rebuilt end to end from its audit record alone (agent/audit.schema.json), by someone who did not produce it, re-running the record's query as its persona over the build it names (its commit, variables and target over the landed files it lists by digest) and matching the result, the question and the answer to the record's seals, with the record's chain verified up to it.
    proven_by: [tests/agent/test_audit.py::test_answer_rebuilt_from_its_audit_record]
    status: not-implemented
  - id: spend-is-capped
    layer: Cost and abuse
    owner: agent-operator
    asserts: Every query and every model call has a cap, and a runaway join stops at the byte cap.
    proven_by: [tests/agent/test_cost.py::test_runaway_join_stops_at_the_cap]
    status: not-implemented
  - id: lab-spend-fenced
    layer: Cost and abuse
    owner: group-controller
    asserts: make cost-check fails unless the billing export holds rows for the lab project and its month-to-date cost, credits included, is $0.00 under a fixed byte cap; unless the daily query-bytes cap, the budget topic, the kill switch workflow (state, source, account, threshold range), its trigger and subscription, the kill switch account (present, enabled) and that account's project roles each match platform/gcp as read live; and unless testIamPermissions shows the agent's own account holds none of the listed permissions on the project, the billing account and the kill switch account that could move a fence. The budget is compared with its definition (scope, period, amount, thresholds, topic) only where this account may read it, and the budget or the project roles are reported as not checked, neither passing nor failing, where it may not. Off the session's proxy, where the reads go out on the machine's gcloud login, a fence whose read that login lacks the permission for, and the agent's permissions, are reported as not checked, neither passing nor failing.
    proven_by: [tests/platform/test_cost_check.py::test_the_applied_fences_match_their_definitions]
    status: implemented
  - id: payments-tie-to-awards
    layer: Data integrity
    owner: accountant-chicago
    asserts: Every Chicago contract number, in the contracts table or only on payments, has exactly one row and one class in models/models/reconciliations/chicago_contract_reconciliation.sql, its paid total leaving out the rows the repeat rule flags; every contract paid over its award is a break; and the count and the dollars of every class, and for each break class a digest of its contract numbers with their excess, equal a reviewed baseline exactly, so any new, grown or moved break fails until a person re-pins the baseline in a reviewed change; where an accepted run (make reconcile-accept) left its per-contract list beside the landing, a failure names the contract numbers that entered, left or changed excess, and without that list it names only the classes. make check proves the mechanism on the committed cut, where a planted overpayment moves the pinned table; the control itself is the landed run over the full files (make reconcile-landed), whose baseline is pinned in the test and which fails on each of a planted $50m overpayment, 79 contracts paid twice, 50 term agreements paid three times their award and 200 contracts served again under a second name, and on a break moved from one contract to another with every class's total unchanged. A second implementation of the classes in the test guards the SQL against slips, not the definitions.
    proven_by:
      - tests/models/test_contract_reconciliation.py::test_the_reconciliation_control_fails_on_a_planted_break
      - tests/models/test_contract_reconciliation.py::test_the_real_landing_reconciles_every_contract
    status: implemented
