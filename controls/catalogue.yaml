# The controls catalogue: each control, its owner, what it asserts and the tests that prove it.
# A control is `implemented` only when its tests exist and prove it; one whose tests exist but
# do not prove it yet says what it `awaits`. tests/test_controls.py checks both.
# Shape: controls/schema.json. Owners are persona ids from access/personas.yaml.

layers:
  - Identity and delegation
  - Data access
  - The conversation
  - Injection and tool authorisation
  - Answer integrity
  - Evaluation and monitoring
  - Change management
  - Accountability
  - Cost and abuse
  - Data integrity

controls:
  - id: queries-run-as-the-asker
    layer: Identity and delegation
    owner: agent-operator
    asserts: Every agent query runs on the asking persona's identity; two personas asking the same question get different rows, and a question without a user identity gets no answer.
    proven_by:
      - tests/agent/test_ask.py::test_two_personas_asking_the_same_question_get_different_rows
      - tests/agent/test_ask.py::test_a_question_without_a_persona_gets_no_answer
    status: not-implemented
    awaits:
      parameter: bigquery
      until_then: "The tests pass on the local engine only: the agent's tool runs on the DuckDB database compiled for the asking persona (access/compile.py), where the Chicago accountant and the UK transport accountant asking the duplicate-payment-rate question get different rows, and a question asked with a value that is not a string, or with a string that is not exactly a persona id of access/personas.yaml (an empty, blank, unknown or space-padded id among those tested), raises before the model is asked or a connection is opened. BigQuery, where the persona's own warehouse grants would decide, is skipped: the agent has no BigQuery mode yet."
  - id: no-persona-holds-conflicting-duties
    layer: Identity and delegation
    owner: group-controller
    asserts: "No persona's grants in access/personas.yaml hold both sides of a conflicting pair of duties in access/review.yaml that the grants can state, within the pair's scope; today that is entering an entry (draft) and approving an entry (post), on any ledgers. Three pairs are reported as not checkable, never as passing, since no grant states one of their duties (creating and paying a vendor, making and deploying a change, administering access and running transactions). The agent account, which can act as every persona, holds entering and approving through the proposer and the approver; the access review shows it and the check does not refuse it."
    proven_by:
      - tests/access/test_review.py::test_a_planted_conflict_fails_the_duty_check
      - tests/access/test_review.py::test_no_persona_holds_a_conflicting_pair
    status: implemented
  - id: warehouse-enforces-visibility
    layer: Data access
    owner: group-controller
    asserts: The warehouse, never the prompt, decides what each persona sees; every persona against every entity and sensitive column is clear, masked, aggregate only or denied as access/personas.yaml says.
    proven_by: [tests/access/test_visibility.py::test_every_persona_sees_its_matrix]
    status: not-implemented
    awaits:
      parameter: bigquery
      until_then: "The test passes on the local engine only, and there 81 of the 120 cells of access/visibility.yaml are proven on labelled invented tables only, not on the landed data: every cell of the ledger, the metric definitions and the audit log (no table built yet, so every edit, draft and post cell), both bank tags (no column until the ERP's tables exist), and every cell of the Dutch government's payments and its accountant's individual's-id tag (no payment rows); 39 are proven on the landed build. BigQuery, whose own rules decide, is skipped."
  - id: aggregates-hold-a-minimum-group-across-the-session
    layer: Data access
    owner: group-controller
    asserts: An answer to a persona whose grant on a product is aggregate gives no figure over fewer rows than the minimum group, counted across the session, so neither one answer nor the difference of two answers in a session covers fewer rows than the minimum group.
    proven_by: [tests/agent/test_aggregates.py::test_no_answer_or_difference_isolates_a_small_group]
    status: not-implemented
  - id: individuals-hashed-before-landing
    layer: Data access
    owner: group-controller
    asserts: The pseudonymiser in ingest/individuals.py returns a vendor or payee name in clear only on evidence of a single organisation (a legal form with no second party joined, a known organisation, or a legal-entity register record of a separate legal person with the whole name, for a name not shaped like a person's); it replaces every other name with an HMAC-SHA-256 keyed from the environment, gives two people two hashes, and refuses to start without the key.
    proven_by:
      - tests/ingest/test_individuals.py::test_only_organisations_leave_in_clear
      - tests/ingest/test_entities.py::test_a_register_record_with_a_persons_exact_name_never_vouches
      - tests/ingest/test_entities.py::test_nothing_else_is_vouched_for
      - tests/ingest/test_entities.py::test_a_vouched_organisation_lands_in_clear_with_what_describes_it
      - tests/ingest/test_chicago_set.py::test_a_payee_hashed_in_payments_blanks_a_contract_description_naming_them
      - tests/ingest/test_uk_transport_spend.py::test_a_supplier_the_register_vouches_for_lands_in_clear_and_a_person_stays_hashed
    status: implemented
  - id: one-person-one-session
    layer: The conversation
    owner: agent-operator
    asserts: "The own agent asked in a session shows its model, on every step but the planning one, the earlier exchanges of that session only, read by session and persona together, and a persona naming a session that is not theirs, or an id no session can have, reads none of it: the turn is recorded refused for foreign-session under a session id the agent makes, never the one given, before any model step or connection. The retention is 30 days. The purge command refuses a log that does not exist, a log whose chain does not verify and, for a log holding a record, a folder of kept values that does not exist, is a link or is open to others, before it removes anything; otherwise it removes every transcript exchange that ended, and every session with none left that started, more than 30 days before it ran, keeps younger ones, and removes the audit log's kept values and salts of the records older than that, with those of an approval whose proposal's go, while every record line stays and the chain verifies. A personal value planted in a question, asked with or without a session, given as the persona, or given as the session id, is in neither the audit log's lines nor any Python log record, nor the process's standard output or error in a session."
    proven_by:
      - tests/agent/test_sessions.py::test_no_cross_session_recall
      - tests/agent/test_sessions.py::test_the_purge_command_removes_expired_transcripts_and_keeps_young_ones
      - tests/agent/test_sessions.py::test_a_purge_removes_an_approvals_kept_draft_with_its_proposal
      - tests/agent/test_sessions.py::test_a_planted_personal_value_never_reaches_the_logs
      - tests/agent/test_sessions.py::test_a_planted_personal_value_asked_in_a_session_never_reaches_the_logs
      - tests/agent/test_sessions.py::test_the_retention_is_thirty_days
      - tests/agent/test_sessions.py::test_a_purge_refused_by_the_log_leaves_the_transcripts
      - tests/agent/test_sessions.py::test_the_log_purge_refuses_a_missing_log_a_missing_folder_and_a_broken_chain
      - tests/agent/test_sessions.py::test_the_log_purge_refuses_a_folder_of_kept_values_open_to_others_or_a_link
    status: implemented
  - id: untrusted-content-cannot-instruct
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: The own agent's model plans its tool calls on a turn holding the question and the verified queries only, and a call it then makes that is not in the plan is refused and not put to the tool policy; an instruction planted in a cell of the persona's database, a column description or a glossary entry passed to the agent, read by a test model that obeys it, to call a tool the policy does not declare, the write tool, a query the metric context lacks, a verified query the asking persona may run, or the question's own query once more, comes back refused as unplanned, and the queries run, with the metric, version, SQL, columns and rows each cites (the planted cell put back), and the turn's audit record equal those of the same question asked with nothing planted; so do three planted calls in one glossary entry, and twenty across a glossary entry, a column description and a cell or all in a cell, where after five refused calls the agent asks the model no more and runs the planned query itself; the text of the reply is not checked.
    proven_by:
      - tests/agent/test_injection.py::test_planted_instructions_are_ignored
      - tests/agent/test_injection.py::test_three_planted_calls_leave_the_questions_query_to_run
      - tests/agent/test_injection.py::test_more_planted_calls_than_the_refusal_limit_leave_the_questions_query_to_run
    status: implemented
  - id: no-outbound-channel-carries-data
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: An answer holds no link or image to an address outside the lab, and the agent sends no request but to the warehouse and its model, so no address an untrusted value or definition asks it to build carries data out.
    proven_by: [tests/agent/test_exfiltration.py::test_no_link_image_or_request_carries_data_out]
    status: not-implemented
  - id: answers-cite-and-re-execute
    layer: Answer integrity
    owner: metric-owner
    asserts: >-
      What is checked (agent/integrity.py, applied by agent/ask.py when the model replies on a turn stopped at no cap): the reply is shown, and the turn recorded answered, only when a cited query's verified question equals the asked question after NFKC, casefolding and white-space collapsing, and each number of the reply traces to a run of such a query whose citation carries a freshness; otherwise a fixed text with no digit is shown and the turn is not recorded answered (it is recorded abstained, or refused for the policy or as unplanned when a call was), which includes a turn that cites no run, whatever its reply says.
      Before reading, the reply is folded to Unicode NFKC form with its format characters (category Cf) removed, and each cited text, date or time cell written whole (folded, its first and last characters letters or digits, with no letter, digit or `_` on either side and no `.` or `,` joining it to a digit) is set aside as that cell's own. A number is ASCII digits with thousands commas in groups of three, one decimal part, one exponent and, as its only sign, an ASCII minus touching the digits with no letter, digit, `_` or `-` before it; it traces when its value equals a cited int, float or Decimal cell (not a bool), or when it follows the word "version" and equals the cited version.
      Reported, so withheld: a number no cited cell equals; any character outside a number that is not white space, a cased letter (Unicode Lu, Ll, Lt), one of the characters . , ; : ! ? = ' " _ and the four curly quotes, or a - between two cased letters (so a dash or minus of any other kind, a parenthesis, a currency sign, a percent sign or Markdown anywhere in the reply); a number joined to a letter, digit or `_`, or written right after a `.`, `,` or `-`; a number right after a sign word of agent/integrity.py (SIGN_BEFORE: minus, negative, down, loss, deficit and others, or such a word then of, by or at) or right before one (SIGN_AFTER: CR, DR, negative and others); a number right before a scale or unit word (SCALE_AFTER: million, bn, k, percent, per, bps, times and others); a number whose value cannot be read; a numeral of Unicode category No or Nl; and an exception raised by the check.
      Re-running the query a record logged, as the record's persona and only when its persona, SQL and bound values are the answer's and the cited query's, in the citations' order, must give the cited run's columns and rows, in any order, and the record's sealed result.
      Stated limits: equality only, so rounded figures, percentages of a share, years or counts in prose that are no cell and the ends of a range are withheld; a figure written with a currency sign, in a tuple, in Markdown or beside any character outside the allowed set is withheld, so honest replies written that way are withheld too; a sign or direction written in words other than the sign words (fell by, a decrease of), and a scale written in words other than the scale words, are not read; a paraphrase of a verified question is withheld, so the agent answers only the verified questions' own wording; a number written in words is not read and passes on a reply not withheld for another reason; which row, column or metric the prose attributes a number to is not checked, so swapped figures pass; a cited text cell's own characters are set aside, so a sign inside a cell's text is not read; the re-run reads whatever database the connection-maker opens and is a verifier's call, not made by ask; a turn stopped at a query's cap, the tool-call cap or the refusal cap shows ask's own fixed message, which names the cap and is not checked; a turn at the refusal cap is not checked and is recorded answered when a planned call returned.
    proven_by:
      - tests/agent/test_answer_integrity.py::test_logged_query_reproduces_the_answer
      - tests/agent/test_answer_integrity.py::test_no_such_test
      - tests/agent/test_answer_integrity.py::test_each_number_of_a_many_row_answer_is_caught_with_a_digit_appended
      - tests/agent/test_answer_integrity.py::test_a_changed_warehouse_is_caught_on_re_run
      - tests/agent/test_answer_integrity.py::test_a_question_outside_the_metrics_gets_an_abstention
      - tests/agent/test_answer_integrity.py::test_only_a_verified_question_as_worded_is_answered
      - tests/agent/test_answer_integrity.py::test_a_reply_with_no_cited_run_is_withheld_whatever_it_says
      - tests/agent/test_answer_integrity.py::test_a_number_with_no_cited_run_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_number_beside_a_cited_run_but_not_in_it_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_sign_flipped_figure_is_withheld
      - tests/agent/test_answer_integrity.py::test_a_sign_the_check_does_not_read_is_reported_whichever_sign_the_cell_has
      - tests/agent/test_answer_integrity.py::test_a_minus_that_folds_to_ascii_is_read_as_the_sign
      - tests/agent/test_answer_integrity.py::test_an_ascii_minus_touching_the_digits_is_the_sign
      - tests/agent/test_answer_integrity.py::test_a_hyphen_is_read_only_between_two_letters
      - tests/agent/test_answer_integrity.py::test_fullwidth_digits_fold_to_the_number
      - tests/agent/test_answer_integrity.py::test_a_figure_written_plainly_is_shown
      - tests/agent/test_answer_integrity.py::test_a_figure_from_a_run_that_does_not_cover_the_question_is_withheld
      - tests/agent/test_answer_integrity.py::test_thousands_are_read_only_in_groups_of_three
      - tests/agent/test_answer_integrity.py::test_a_text_cell_is_set_aside_only_where_it_is_written_whole
      - tests/agent/test_answer_integrity.py::test_a_range_is_reported_not_matched
      - tests/agent/test_answer_integrity.py::test_a_tuple_of_figures_is_reported_for_its_parentheses
      - tests/agent/test_answer_integrity.py::test_a_numeral_that_is_no_decimal_digit_is_reported
      - tests/agent/test_answer_integrity.py::test_a_reply_the_check_cannot_read_is_withheld_and_recorded
      - tests/agent/test_answer_integrity.py::test_a_number_that_is_not_a_cell_as_written_is_reported
      - tests/agent/test_answer_integrity.py::test_a_run_without_freshness_traces_no_number
      - tests/agent/test_answer_integrity.py::test_a_re_run_that_does_not_reproduce_is_reported
      - tests/agent/test_answer_integrity.py::test_a_run_logged_unlike_its_citation_is_not_re_run
      - tests/agent/test_answer_integrity.py::test_the_re_run_is_made_as_the_logged_persona
      - tests/agent/test_answer_integrity.py::test_runs_are_compared_with_citations_in_order
      - tests/agent/test_answer_integrity.py::test_a_turn_stopped_at_the_cap_shows_its_own_message
      - tests/agent/test_answer_integrity.py::test_a_withheld_reply_keeps_the_refusal_the_turn_records
    status: implemented
  - id: scored-by-execution
    layer: Evaluation and monitoring
    owner: metric-owner
    asserts: The scorer (agent/evals/score.py) scores each answer to the golden set (agent/evals/golden.yaml) by running the SQL its citations name again on the asking persona's connection and comparing what it returns with the result frozen there, so an answer whose text and reported rows hold the expected figure while its cited SQL returns another scores wrong; on the sample build the committed metric context scores every case right, and two metric definitions changed in a copy of the context (the duplicate amount rate taken by rows, constant-currency spend kept across bases) score exactly the cases they change wrong-and-sure, which its report names with exit status 1.
    proven_by:
      - tests/agent/test_evaluation.py::test_metric_change_shows_as_drift
      - tests/agent/test_evaluation.py::test_the_score_comes_from_running_the_cited_sql
    status: implemented
  - id: landed-file-breaks-fail-its-quality-suite
    layer: Evaluation and monitoring
    owner: group-controller
    asserts: python -m ingest.quality <source> runs the landed file's GX Core suite and exits non-zero when the file breaks its schema, has a null key, holds a value out of its range or moves a known-mess count from the value measured on the pinned file; each suite passes on a fixture of its source and fails on that fixture with one planted break of each kind; and a broken rule on a column that can hold a name reports a count, never the name.
    proven_by:
      - tests/ingest/test_quality.py::test_each_suite_passes_on_its_fixture
      - tests/ingest/test_quality.py::test_each_suite_fails_on_its_fixture_with_one_planted_break
      - tests/ingest/test_quality.py::test_the_command_exits_non_zero_on_a_break_and_names_each_landed_file_of_a_set
      - tests/ingest/test_quality.py::test_a_break_in_a_name_column_reports_counts_and_never_the_name
      - tests/ingest/test_quality.py::test_a_column_that_can_hold_a_name_carries_only_rules_whose_result_is_a_count
    status: implemented
  - id: release-ships-as-one-unit
    layer: Change management
    owner: approver
    asserts: Prompt, model, tools and metric definitions ship and roll back together, and a failed gate blocks the release.
    proven_by: [tests/operations/test_release.py::test_failed_gate_blocks_release]
    status: not-implemented
  - id: breaking-contract-change-stopped
    layer: Change management
    owner: group-controller
    asserts: A breaking change needs a new major version and a stated reason. make check fails when a data contract in the working tree, matched by contract id with the one on origin/main wherever its file sits, holds a change the Data Contract CLI's breaking comparison grades as an error (among them a column removed or renamed, a type changed, a column made nullable, a key or uniqueness dropped, an accepted value added, a bound loosened, a quality rule removed) or a quality rule of origin/main's gone or changed beyond its wording, unless both versions are MAJOR.MINOR.PATCH, the contract's major number is above origin/main's and its breakingChanges custom property lists exactly the breaks found, each with a reason; a break not listed, a listed break that did not happen, a break listed without a reason or twice, and a break under a major version that did not go up each fail, and since the list is compared with origin/main's contract, a list already merged excuses no later break. While origin/main holds a contract, these fail regardless of the version, in a working-tree contract, new ones included, a shape the gate cannot compare by normalised table and column (a name it cannot normalise, two schema entries of one name or over one table, two properties of one schema of one name or over one column, nested properties or items, two quality rules under one place and id, of one schema entry or one property, or of a schema entry named after a property's place and that property); a property over a column origin/main classifies personal without that classification; a property whose schema entry describes a table origin/main describes under another contract id or schema name, or a property over a column origin/main describes under another property name; a column origin/main classifies personal that the tree no longer describes in a change that adds a column not classified personal; a schema name of origin/main's contract gone from it; a contract of origin/main whose id the tree no longer holds, a contract file YAML cannot read or whose id is missing or not text, two files with one id, and a matched contract the CLI cannot read; and the gate fails when origin/main is not in the clone, git cannot read its contracts, or one of them has no id or an id that is not text. As limits, while origin/main holds no contract the gate passes without comparing anything; the rule on a table origin/main describes reads properties, so a schema entry with no properties over such a table is not refused by it; contracts on origin/main are read leniently, so a shape refused here that reached origin/main fails each change that keeps it; and the gate reads contracts, not data, so a classification lost across two changes (an unclassified column added, then the personal one removed) or a column copied under a new physical name in the models is outside it, covered by review of the contract with the masking tags and by the tests that hold the contract equal to the dbt project.
    proven_by:
      - tests/models/test_payments_contract.py::test_a_breaking_change_fails_the_gate
      - tests/models/test_payments_contract.py::test_the_gate_matches_contracts_by_id_wherever_they_are
      - tests/models/test_payments_contract.py::test_a_clone_without_main_fails_and_says_how_to_fetch_it
      - tests/models/test_contract_gate.py::test_a_new_major_version_listing_exactly_its_breaks_passes
      - tests/models/test_contract_gate.py::test_a_break_fails_unless_a_new_major_version_lists_exactly_it_with_a_reason
      - tests/models/test_contract_gate.py::test_a_break_under_the_same_major_version_fails_as_before
      - tests/models/test_contract_gate.py::test_a_merged_major_versions_list_excuses_no_later_break
      - tests/models/test_contract_gate.py::test_no_version_passes_a_shape_the_gate_cannot_compare_or_a_personal_column_unclassified
      - tests/models/test_contract_gate.py::test_a_refusal_listed_verbatim_still_fails
      - tests/models/test_contract_gate.py::test_the_rules_hold_across_the_contracts_of_the_tree_new_ones_included
      - tests/models/test_contract_gate.py::test_a_published_contract_of_two_schemas_over_one_table_fails_until_fixed
      - tests/models/test_contract_gate.py::test_a_contract_at_a_path_git_quotes_is_compared
      - tests/models/test_contract_gate.py::test_no_version_declares_a_contract_gone_or_doubled
      - tests/models/test_contract_gate.py::test_no_version_declares_an_unreadable_contract
      - tests/models/test_contract_gate.py::test_a_working_tree_contract_without_a_text_id_fails_the_gate
      - tests/models/test_contract_gate.py::test_an_origin_main_contract_without_a_text_id_stops_the_gate
      - tests/models/test_contract_gate.py::test_a_schema_rename_hides_no_break_and_in_place_each_needs_its_line
      - tests/models/test_contract_gate.py::test_a_base_git_cannot_read_fails_the_gate
    status: implemented
  - id: metric-definition-changes-only-under-a-new-version
    layer: Change management
    owner: metric-owner
    asserts: make check fails when a MetricFlow metric's definition differs from origin/main's under the same version. Each tree is parsed by dbt on the local target (the working tree also on BigQuery profiles, offline, which fails it when a node lands off the routing), origin/main read from git's objects as stored, so export attributes cannot leave a file out or rewrite one, and the working tree's tracked and new files, each limited to the dbt project folder and the folders its project file names. A definition is the metric's own entry of the semantic manifest dbt writes but its version and owner, the metrics it is built from transitively with those its filters read, the measures and semantic models it resolves to and those joined through a shared entity, the time spines, and the project file's vars; so a metric moved to another folder dbt reads, an old copy hidden by .dbtignore beside a changed one, metrics turned off in the project file, a moved time spine, a changed var or a metric on a model's own entry cannot hide a change. It also fails when a version goes down, is missing or is not an integer from 1 to 2^53 - 1, when a metric has no owner, when a metric origin/main defines is gone or renamed, when dbt Jinja sits where dbt renders it in a semantic model or metric entry or in the entry of a model, seed or snapshot a semantic model reads or a time spine is, when the project file holds Jinja or a path setting that is absolute or outside the tree, when what dbt reads holds a symbolic link or a submodule, when a tree declares dbt packages, when the project defines a macro named generate_alias_name, generate_schema_name or generate_database_name or one of those after a <prefix>__ (such as default__generate_alias_name or duckdb__generate_schema_name, which dbt's own versions dispatch to) but the one generate_schema_name whose text is the gate's own, when the project file sets a dispatch entry for the dbt macro namespace, when Jinja in a file of the project dbt parses names dbt's own invocation (context, flags, invocation_args_dict, invocation_id, selected_resources, should_full_refresh or should_store_failures) as a name token of dbt's own Jinja lexer or a word of a string token's decoded value, in the file's text, or in a string of a schema file's decoded YAML (what dbt renders), or that lexer cannot read one of them, or it reaches the invocation another way (dbt by a key or a mapping method, adapter other than by an attribute, adapter.config, a dispatch whose macro is not one string literal, a name opening with __), which differs between the gate's parse and a real build, when git cannot list origin/main's tree or read its files or dbt cannot parse a tree (its message naming no dbt output), when origin/main is not in the clone, and when HEAD does not contain origin/main, so of two branches bumping one metric to the same version the second must merge the first. Outside the comparison are model SQL, command-line vars, relation names decided by the profile, a model's SQL config() or another target (but where the routing holds a node to land on BigQuery), a macro dbt calls only when it runs models (such as generate_latest_version_pointer_alias), and a stale origin/main, which cannot be told apart offline.
    proven_by:
      - tests/semantics/test_metric_versions.py::test_a_changed_definition_under_the_same_version_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_git_attributes_cannot_hide_a_change_on_main
      - tests/semantics/test_metric_versions.py::test_a_project_var_is_part_of_every_definition
      - tests/semantics/test_metric_versions.py::test_project_vars_changed_with_every_version_bumped_pass
      - tests/semantics/test_metric_versions.py::test_a_metric_read_in_a_filter_is_part_of_the_definition
      - tests/semantics/test_metric_versions.py::test_a_metric_on_a_model_entry_is_compared_too
      - tests/semantics/test_metric_versions.py::test_a_definition_dbt_reads_otherwise_or_cannot_read_fails_the_gate
      - tests/semantics/test_metric_versions.py::test_a_metric_reading_a_dbt_var_fails_even_when_only_the_var_changes
      - tests/semantics/test_metric_versions.py::test_a_link_or_a_path_outside_the_tree_fails_the_gate_and_is_not_echoed
      - tests/semantics/test_metric_versions.py::test_only_what_dbt_reads_is_exported_and_judged
