# The controls catalogue: each control, its owner, what it asserts and the tests that prove it.
# A control is `implemented` only when its tests exist; tests/test_controls.py checks it.
# Shape: controls/schema.json. Owners are persona ids from access/personas.yaml.

layers:
  - Identity and delegation
  - Data access
  - The conversation
  - Injection and tool authorisation
  - Answer integrity
  - Evaluation and monitoring
  - Change management
  - Accountability
  - Cost and abuse

controls:
  - id: queries-run-as-the-asker
    layer: Identity and delegation
    owner: agent-operator
    asserts: Every agent query runs on the asking persona's identity; two personas asking the same question get different rows, and a question without a user identity gets no answer.
    proven_by: [tests/agent/test_identity.py::test_two_personas_same_question_different_rows]
    status: not-implemented
  - id: no-persona-holds-conflicting-duties
    layer: Identity and delegation
    owner: group-controller
    asserts: "No persona's grants in access/personas.yaml hold both sides of a conflicting pair of duties in access/review.yaml that the grants can state, within the pair's scope; today that is entering an entry (draft) and approving an entry (post), on any ledgers. Three pairs are reported as not checkable, never as passing, since no grant states one of their duties (creating and paying a vendor, making and deploying a change, administering access and running transactions). The agent account, which can act as every persona, holds entering and approving through the proposer and the approver; the access review shows it and the check does not refuse it."
    proven_by:
      - tests/access/test_review.py::test_a_planted_conflict_fails_the_duty_check
      - tests/access/test_review.py::test_no_persona_holds_a_conflicting_pair
    status: implemented
  - id: warehouse-enforces-visibility
    layer: Data access
    owner: group-controller
    asserts: The warehouse, never the prompt, decides what each persona sees; every persona against every entity and sensitive column is clear, masked, aggregate only or denied as access/personas.yaml says.
    proven_by: [tests/access/test_visibility.py::test_every_persona_sees_its_matrix]
    status: not-implemented
  - id: aggregates-hold-a-minimum-group-across-the-session
    layer: Data access
    owner: group-controller
    asserts: An answer to a persona whose grant on a product is aggregate gives no figure over fewer rows than the minimum group, counted across the session, so neither one answer nor the difference of two answers in a session isolates a small group, or a figure of an entity whose rows the persona does not read.
    proven_by: [tests/agent/test_aggregates.py::test_no_answer_or_difference_isolates_a_small_group]
    status: not-implemented
  - id: individuals-hashed-before-landing
    layer: Data access
    owner: group-controller
    asserts: The pseudonymiser in ingest/individuals.py returns a vendor or payee name in clear only on evidence of a single organisation (a legal form with no second party joined, a known organisation, or a legal-entity register record of a separate legal person with the whole name, for a name not shaped like a person's); it replaces every other name with an HMAC-SHA-256 keyed from the environment, gives two people two hashes, and refuses to start without the key.
    proven_by:
      - tests/ingest/test_individuals.py::test_only_organisations_leave_in_clear
      - tests/ingest/test_entities.py::test_a_register_record_with_a_persons_exact_name_never_vouches
      - tests/ingest/test_entities.py::test_nothing_else_is_vouched_for
      - tests/ingest/test_entities.py::test_a_vouched_organisation_lands_in_clear_with_what_describes_it
      - tests/ingest/test_chicago_set.py::test_a_payee_hashed_in_payments_blanks_a_contract_description_naming_them
      - tests/ingest/test_uk_transport_spend.py::test_a_supplier_the_register_vouches_for_lands_in_clear_and_a_person_stays_hashed
    status: implemented
  - id: one-person-one-session
    layer: The conversation
    owner: agent-operator
    asserts: No answer recalls another session, and the purge removes transcripts past their retention.
    proven_by: [tests/agent/test_sessions.py::test_no_cross_session_recall]
    status: not-implemented
  - id: untrusted-content-cannot-instruct
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: An instruction planted in a cell, a column description or a glossary entry changes no tool call; tools are read-only and denied by default.
    proven_by: [tests/agent/test_injection.py::test_planted_instructions_are_ignored]
    status: not-implemented
  - id: no-outbound-channel-carries-data
    layer: Injection and tool authorisation
    owner: agent-operator
    asserts: An answer holds no link or image to an address outside the lab, and the agent sends no request but to the warehouse and its model, so no address an untrusted value or definition asks it to build carries data out.
    proven_by: [tests/agent/test_exfiltration.py::test_no_link_image_or_request_carries_data_out]
    status: not-implemented
  - id: answers-cite-and-re-execute
    layer: Answer integrity
    owner: metric-owner
    asserts: Every number in an answer cites its metric version, query and freshness, and re-running the logged query returns it.
    proven_by: [tests/agent/test_answer_integrity.py::test_logged_query_reproduces_the_answer]
    status: not-implemented
  - id: scored-by-execution
    layer: Evaluation and monitoring
    owner: metric-owner
    asserts: Answers are scored by executing their queries against a golden set, and a metric change that moves the score is reported.
    proven_by: [tests/agent/test_evaluation.py::test_metric_change_shows_as_drift]
    status: not-implemented
  - id: landed-file-breaks-fail-its-quality-suite
    layer: Evaluation and monitoring
    owner: group-controller
    asserts: python -m ingest.quality <source> runs the landed file's GX Core suite and exits non-zero when the file breaks its schema, has a null key, holds a value out of its range or moves a known-mess count from the value measured on the pinned file; each suite passes on a fixture of its source and fails on that fixture with one planted break of each kind; and a broken rule on a column that can hold a name reports a count, never the name.
    proven_by:
      - tests/ingest/test_quality.py::test_each_suite_passes_on_its_fixture
      - tests/ingest/test_quality.py::test_each_suite_fails_on_its_fixture_with_one_planted_break
      - tests/ingest/test_quality.py::test_the_command_exits_non_zero_on_a_break_and_names_each_landed_file_of_a_set
      - tests/ingest/test_quality.py::test_a_break_in_a_name_column_reports_counts_and_never_the_name
      - tests/ingest/test_quality.py::test_a_column_that_can_hold_a_name_carries_only_rules_whose_result_is_a_count
    status: implemented
  - id: release-ships-as-one-unit
    layer: Change management
    owner: approver
    asserts: Prompt, model, tools and metric definitions ship and roll back together, and a failed gate blocks the release.
    proven_by: [tests/operations/test_release.py::test_failed_gate_blocks_release]
    status: not-implemented
  - id: breaking-contract-change-stopped
    layer: Change management
    owner: group-controller
    asserts: make check fails when a data contract in the working tree breaks a consumer of the one on origin/main, matched by contract id wherever the file sits (a column removed or renamed, a type changed, a column made nullable, a key or uniqueness dropped, an accepted value added, a bound loosened, a quality rule removed, renamed or changed beyond its wording, a personal classification removed, the contract retired, renamed or unreadable), and when origin/main is not in the clone to compare with; while origin/main holds no contract the first one passes.
    proven_by:
      - tests/models/test_payments_contract.py::test_a_breaking_change_fails_the_gate
      - tests/models/test_payments_contract.py::test_the_gate_matches_contracts_by_id_wherever_they_are
      - tests/models/test_payments_contract.py::test_a_clone_without_main_fails_and_says_how_to_fetch_it
    status: implemented
  - id: answer-rebuilt-from-audit
    layer: Accountability
    owner: group-controller
    asserts: One answer can be rebuilt end to end from its audit record alone, by someone who did not produce it.
    proven_by: [tests/agent/test_audit.py::test_answer_rebuilt_from_its_audit_record]
    status: not-implemented
  - id: spend-is-capped
    layer: Cost and abuse
    owner: agent-operator
    asserts: Every query and every model call has a cap, and a runaway join stops at the byte cap.
    proven_by: [tests/agent/test_cost.py::test_runaway_join_stops_at_the_cap]
    status: not-implemented
  - id: lab-spend-fenced
    layer: Cost and abuse
    owner: group-controller
    asserts: make cost-check fails unless the billing export holds rows for the lab project and its month-to-date cost, credits included, is $0.00 under a fixed byte cap; unless the daily query-bytes cap, the budget topic, the kill switch workflow (state, source, account, threshold range), its trigger and subscription, the kill switch account (present, enabled) and that account's project roles each match platform/gcp as read live; and unless testIamPermissions shows the agent's own account holds none of the listed permissions on the project, the billing account and the kill switch account that could move a fence. The budget is compared with its definition (scope, period, amount, thresholds, topic) only where this account may read it, and the budget or the project roles are reported as not checked, neither passing nor failing, where it may not.
    proven_by: [tests/platform/test_cost_check.py::test_the_applied_fences_match_their_definitions]
    status: implemented
