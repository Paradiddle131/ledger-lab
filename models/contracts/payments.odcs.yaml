# The payments data product's contract, in the Open Data Contract Standard: the mart's columns in
# order, their types, nullability and accepted values, what each means, and the rules its rows keep.
# `make contract` fails on a change that breaks a consumer of the contract on origin/main
# (models/contracts/gate.py). `make contract-test` runs `datacontract test` over the local dbt
# build, through a copy in the CLI's older DuckDB format (the `local` server's file); the tests run
# it over the sample and the landed builds. The descriptions are the dbt docs' text
# (models/models/marts/payments/), held equal by a test.
apiVersion: v3.2.0
kind: DataContract
id: payments
name: Payments
version: 1.0.0
status: active
description:
  purpose: One row per payment of every entity, in the entity's own currency, with the contract it was made against and that contract's award after revisions.
  usage: Leave out the rows flagged `is_repeat` to count each payment once; translate amounts with the `translate_currency` macro before adding entities together.
  limitations: Amounts are as each publisher serves them, never corrected; a payee who is or may be a person is a keyed hash, and nothing here un-hashes it.
servers:
  - server: local
    type: duckdb
    database: target/ledger_lab.cli.duckdb
    schema: main
schema:
  - name: payments
    physicalName: payments
    physicalType: table
    description: >
      The payments data product: one row per payment of every entity, in the entity's own
      currency, with the contract it was made against and that contract's award after revisions.
      Rows are as the source serves them: refunds stay negative, a row the source serves again
      stays and is flagged `is_repeat`, so a sum that leaves repeats out counts each payment once,
      and a row the source gives only a year (Chicago's rolled-up payments) stays, with no day.
      Each entity's intermediate model brings its rows in this column shape; the City of
      Chicago's detail (rolled-up rows, department) stays in `int_chicago__payments`, and every
      landed version of a UK month in `int_uk_transport__payment_versions`. The last four
      columns hold the published `vendor_name` and `document_number` split by the hash each
      value carries.
    properties:
      # Not classified personal: it names one payment, not a payee. On a hashed row it is a hash of
      # the row as landed, hashed name included, so it cannot be recomputed from the publisher's
      # files without the hash key, and each of a payee's payments gets its own key, so it links
      # nothing the row does not already show. `document_number` is personal: on a hashed UK row
      # it is a keyed hash that ties together the rows of one hashed transaction.
      - name: payment_key
        logicalType: string
        physicalType: VARCHAR
        required: true
        unique: true
        primaryKey: true
        description: |-
          A key naming one payment, unique across entities: a hash of the entity and every landed column of the payment's row, numbered among rows identical in all of them.
          It is the same in every landing made with the same hash key; a new hash key changes it on every row whose payee is hashed, and a row the publisher changes gets a new key.
          For the UK Department for Transport it is `uk-transport:`, the served file's name and the row's position in it, stable while the file stays pinned; a revised month's new file gives every row of that month a new key, unchanged rows included.
      - name: entity_id
        logicalType: string
        physicalType: VARCHAR
        required: true
        enum:
          - value: chicago
          - value: uk-transport
          - value: nl-government
        description: |-
          The entity that paid, by its id in `access/personas.yaml` and the calendar seeds (`chicago`, `uk-transport`).
          The Dutch government's `nl-government` is accepted too, though no row carries it: its budget file holds budget lines, not payments, so it adds none.
      - name: currency
        logicalType: string
        physicalType: VARCHAR
        required: true
        enum:
          - value: USD
          - value: GBP
          - value: EUR
        description: |-
          The currency the entity paid in, its own (`USD` for Chicago, `GBP` for the UK department, `EUR`, which no row carries yet, for the Dutch government); amounts are never translated here.
      - name: payment_date
        logicalType: date
        physicalType: DATE
        description: |-
          The day the payment was made (Chicago's check date, the UK department's served date).
          Null when the source gives only a year: a rolled-up row is never dated 1 January or any other day.
      - name: fiscal_year
        logicalType: integer
        physicalType: BIGINT
        description: |-
          The entity's fiscal year, from the fiscal calendar: the year of the payment's day, or for a row the source gives only a year, the fiscal year that is exactly that calendar year (Chicago's runs January to December; the UK department's April to March, labelled by the year it opens in).
          Null for Chicago's 2002 row, which holds 1996 to 2002, and wherever the calendars do not cover the year (they cover the `fiscal_years` var's years).
      - name: fiscal_period
        logicalType: integer
        physicalType: BIGINT
        logicalTypeOptions:
          minimum: 1
          maximum: 12
        description: |-
          The fiscal period (1 to 12) of the payment's day, from the fiscal calendar; null when the payment has no day or the calendars do not cover it.
      - name: amount
        logicalType: number
        physicalType: DECIMAL(28,6)
        required: true
        description: |-
          The amount paid, a decimal in the entity's currency (never a float), with its sign as served: a refund or reversal is negative.
      - name: vendor_name
        logicalType: string
        physicalType: VARCHAR
        required: true
        classification: personal
        description: |-
          The payee as landed: the name in clear, `person:` and its keyed hash for a payee who is or may be a person, or the UK department's own `REDACTED`, which names no one.
          It holds the same fact as `vendor_organisation_name` and `vendor_person_key` together, and stays because the published contract promises it; it goes when a breaking change is next made deliberately.
      - name: vendor_is_hashed
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: |-
          True when the payee's name is a keyed hash.
      - name: document_number
        logicalType: string
        physicalType: VARCHAR
        classification: personal
        description: |-
          The document the payment was made on: Chicago's voucher number, as served (`Multiple` for a payment covering several vouchers), null on a rolled-up row, which has none; the UK department's transaction number as landed, `#` where it gives none and a keyed hash (`id:`) on a hashed or redacted row, so it repeats.
          It holds the same values as `document_reference` and `document_key` together, and a hashed payee's Chicago voucher number besides, and stays because the published contract promises it, until a breaking change is next made deliberately and says where that voucher number goes.
      - name: contract_number
        logicalType: string
        physicalType: VARCHAR
        description: |-
          The contract the payment was made against, as served; null where there is none (Chicago's `DV`, a direct voucher, and every UK row: the department's files carry no contract).
          A number the contracts table lacks stays, with no award.
      - name: award_after_revisions
        logicalType: number
        physicalType: DECIMAL(28,6)
        description: |-
          The contract's award once every revision is applied, a decimal in the entity's currency; null where the payment has no contract or its contract number finds none, as on every UK row.
          For Chicago it is the sum of the award amounts of the contract's original award and every revision, each revision counted once: every row of the contracts table is a change to the award, not a new total, so a negative amount takes money off, and a revision numbered by the legacy system (`C514026`) counts like any other.
          An award of 0 is no fixed award, not a break: the City describes a blanket contract awarded $0 as one that "depends upon requirements", ordered as needed (5,328 contracts on the pinned files, 2,125 of them paid $2.73bn in all); 28 contracts have a negative award.
      - name: source_table
        logicalType: string
        physicalType: VARCHAR
        required: true
        description: |-
          The landed table the row comes from (`chicago-payments`, `uk-transport-spend-2025`).
      - name: is_repeat
        logicalType: boolean
        physicalType: BOOLEAN
        required: true
        description: |-
          True on a row that repeats another served row of the same entity, so a sum that leaves repeats out counts each payment once; false on the first row of each group and wherever an entity has no rule for repeats.
          For Chicago a row is a repeat when it is a copy after the first of rows identical in every landed column, when it has no department beside an otherwise identical row that has one (the row with the department is the first), when it has no department beside a row that has one and is the same but for the vendor name, the City serving one payment under two names of its vendor (the row with the department is the first), or when it is a rolled-up year whose amount equals to the cent the year's other dated payments of its vendor and contract (the dated rows are the first); `int_chicago__payments` names each repeat's kind.
          That they are the same payment served again rests on paid totals, not on the City saying so: with repeats left out, more contracts are paid exactly their award after revisions than with them.
          Two rows the same but for the vendor name, neither with a department, are not flagged: nothing beside the name pairs them, and a wrong flag would drop a real payment from every total.
          For the UK department no row is flagged: its rows identical as landed are consecutive rows under one transaction number, and nothing in the files tells those identical in every served cell from two equal lines of one document, while hashed ones that differ in the description the landing drops are certainly separate lines (`int_uk_transport__payments` gives the evidence).
      # Added after the contract was published, so optional, as the gate requires: the published
      # mixed columns split by the hash each value carries. The person and document keys are
      # personal; the clear columns are not, since neither ever holds a value of a hashed row.
      - name: vendor_organisation_name
        logicalType: string
        physicalType: VARCHAR
        description: |-
          The payee's name in clear, exactly `vendor_name` where `vendor_is_hashed` is false: an organisation's name, or the UK department's own `REDACTED`, which names no one; null where the payee is or may be a person.
          Every row has exactly one of this and `vendor_person_key`.
      - name: vendor_person_key
        logicalType: string
        physicalType: VARCHAR
        classification: personal
        description: |-
          The keyed hash that stands for a payee who is or may be a person, exactly `vendor_name` where `vendor_is_hashed` is true (`person:` and the hash, as landed); null for an organisation.
          Every row has exactly one of this and `vendor_organisation_name`.
      - name: document_reference
        logicalType: string
        physicalType: VARCHAR
        description: |-
          The document number in clear, exactly `document_number` on a row whose payee is in clear and whose number is no keyed hash; null on a hashed payee's rows and on any row whose number a hashed payee's row of the same entity carries too, since the publisher's own search finds the payee by it.
      - name: document_key
        logicalType: string
        physicalType: VARCHAR
        classification: personal
        description: |-
          The keyed hash that stands for a hashed or redacted UK row's transaction number, exactly `document_number` where it is `id:` and the hash; null everywhere else.
          It ties together the rows of one hashed transaction and cannot be looked up in the department's files.
    quality:
      - id: currency-is-the-entitys-own
        type: sql
        dimension: consistency
        description: Every row is in its entity's own currency (Chicago in US dollars, the UK department in pounds, the Dutch government in euros).
        query: |-
          select count(*) from payments
          where not ((entity_id = 'chicago' and currency = 'USD')
            or (entity_id = 'uk-transport' and currency = 'GBP')
            or (entity_id = 'nl-government' and currency = 'EUR'))
        mustBe: 0
      - id: hashed-exactly-when-the-name-is-a-hash
        type: sql
        dimension: consistency
        description: "`vendor_is_hashed` is true exactly on the rows whose name is `person:` and 64 lower-case hexadecimal digits."
        query: |-
          select count(*) from payments
          where vendor_is_hashed <> (
            vendor_name like 'person:%'
            and length(vendor_name) = 71
            and ltrim(substr(vendor_name, 8), '0123456789abcdef') = '')
        mustBe: 0
      - id: chicago-row-count-equals-its-model
        type: sql
        dimension: completeness
        description: The mart holds as many Chicago rows as Chicago's own payments model.
        query: |-
          select (select count(*) from payments where entity_id = 'chicago')
            - (select count(*) from int_chicago__payments)
        mustBe: 0
      - id: uk-transport-row-count-equals-its-model
        type: sql
        dimension: completeness
        description: The mart holds as many UK department rows as the department's own payments model.
        query: |-
          select (select count(*) from payments where entity_id = 'uk-transport')
            - (select count(*) from int_uk_transport__payments)
        mustBe: 0
      - id: one-of-organisation-name-and-person-key
        type: sql
        dimension: consistency
        description: Every row has exactly one of `vendor_organisation_name` and `vendor_person_key`.
        query: |-
          select count(*) from payments
          where (vendor_organisation_name is null) = (vendor_person_key is null)
        mustBe: 0
      - id: payee-columns-split-the-published-name
        type: sql
        dimension: consistency
        description: "`vendor_organisation_name` and `vendor_person_key` are `vendor_name` split by `vendor_is_hashed`, on every row."
        query: |-
          select count(*) from payments
          where vendor_organisation_name is distinct from
              (case when not vendor_is_hashed then vendor_name end)
            or vendor_person_key is distinct from (case when vendor_is_hashed then vendor_name end)
        mustBe: 0
      - id: document-columns-split-the-published-number
        type: sql
        dimension: consistency
        description: "`document_key` is `document_number` where it is a keyed hash, and `document_reference` is it where the payee is in clear and no hashed payee's row of the entity carries it."
        query: |-
          select count(*) from payments as p
          where p.document_key is distinct from
              (case when p.document_number like 'id:%' then p.document_number end)
            or p.document_reference is distinct from (
              case
                when not p.vendor_is_hashed and p.document_number not like 'id:%'
                  and not exists (
                    select 1 from payments as h
                    where h.vendor_is_hashed and h.entity_id = p.entity_id
                      and h.document_number = p.document_number)
                  then p.document_number
              end)
        mustBe: 0
