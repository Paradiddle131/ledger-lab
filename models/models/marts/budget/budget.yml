          - {source_row: 4606, fiscal_year: 2022, kind: U, chapter_code: A, chapter_name: Infrastructuurfonds, article_number: "12", article_name: Hoofdwegennet, moment: StandOWB, amount_eur: 2879349000}
          - {source_row: 4606, fiscal_year: 2022, kind: U, chapter_code: A, chapter_name: Infrastructuurfonds, article_number: "12", article_name: Hoofdwegennet, moment: StandO1, amount_eur: 3032003000}
          - {source_row: 4606, fiscal_year: 2022, kind: U, chapter_code: A, chapter_name: Infrastructuurfonds, article_number: "12", article_name: Hoofdwegennet, moment: StandSBS, amount_eur: 0}
          - {source_row: 4606, fiscal_year: 2022, kind: U, chapter_code: A, chapter_name: Infrastructuurfonds, article_number: "12", article_name: Hoofdwegennet, moment: StandO2, amount_eur: 3077394000}
          - {source_row: 4606, fiscal_year: 2022, kind: U, chapter_code: A, chapter_name: Infrastructuurfonds, article_number: "12", article_name: Hoofdwegennet, moment: Realisatie, amount_eur: 2952254000}
      - input: ref('fiscal_periods')
        rows:
