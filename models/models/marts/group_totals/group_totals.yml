models:
  - name: group_totals
    description: >
      The group-totals data product: what each entity spent, by span, in its own currency and in
      the reporting currency (the `group_totals` var's, EUR) at actual and at constant rates. One
      row per entity, span and basis; a span is one of the entity's fiscal periods, or its whole
      fiscal year for figures the source gives only by year (`fiscal_period` null), and a yearly
      figure is never spread over months. The entities bring different things, so every row says
      what its figure is (`basis`): the City of Chicago all its payments, the UK Department for
      Transport only its payments over £25,000 and only for fiscal 2025, the Dutch central
      government no payments at all but its cash-expenditure outturn for a year, the whole State's
      budget, so the scales differ by orders of magnitude. A group total for a span is the sum of
      the rows of that span across entities, and is only as comparable as their bases: a month's
      total is Chicago's payments, with the UK's large payments from April 2025 to March 2026; a
      calendar year's whole-year rows are Chicago's yearly roll-ups (2023 and 2024) and the Dutch
      outturn (2023 to 2025), which no month holds. Left out, with the
      rule that leaves each figure out in `group_totals_figures`: payments the source serves again,
      years the fiscal calendars do not cover, Dutch years with no outturn served (2026: a budget
      never stands in for spend), commitments and receipts (never spend), and any span the ECB
      rates do not cover. Translated figures are derived from the ECB's reference rates (Source:
      European Central Bank). Aggregation thresholds for the personas granted `aggregate` access
      are not applied here.
    columns:
      - name: group_total_key
        description: The row's key, entity, year, period (or `year`) and basis (`chicago-2024-3-payments`).
        data_tests:
          - unique
          - not_null
      - name: entity_id
        description: The entity, as in the fiscal calendars and access/personas.yaml.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [chicago, uk-transport, nl-government]
      - name: fiscal_year
        description: The entity's fiscal year, labelled by the calendar year it opens in.
        data_tests:
          - not_null
      - name: fiscal_period
        description: >
          The entity's fiscal period (1 to 12, a calendar month); null on a row for a whole fiscal
          year, whose figures have a year and no day.
      - name: period_start
        description: The span's first day, the period's or the fiscal year's.
        data_tests:
          - not_null
      - name: period_end
        description: The span's last day.
        data_tests:
          - not_null
      - name: basis
        description: "{{ doc('group_totals_basis') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [payments, payments-year-rollup, payments-over-25k, cash-outturn]
      - name: figures
        description: How many figures (payments, or Dutch budget lines) the row sums.
        data_tests:
          - not_null
      - name: currency
        description: The entity's own currency, the currency of `amount`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [USD, GBP, EUR]
      - name: amount
        description: The figures' sum in the entity's own currency, untranslated.
        data_tests:
          - not_null
      - name: reporting_currency
        description: The currency of the translated amounts, the `group_totals` var's.
        data_tests:
          - not_null
      - name: amount_at_actual_rates
        description: "{{ doc('group_totals_actual_rates') }}"
        data_tests:
          - not_null
      - name: amount_at_constant_rates
        description: >
          The figures' sum in the reporting currency, each figure translated at the ECB rates of
          `constant_rates_on` and rounded to the cent, so a change between spans shows spending
          moving and not the rates.
        data_tests:
          - not_null
      - name: constant_rates_on
        description: >
          The one day whose ECB rates translate every figure at constant rates (the `group_totals`
          var's: 29 December 2023, the last rates of the first fiscal year the calendars cover).
        data_tests:
          - not_null

  - name: group_totals_figures
    description: >
      One row per figure an entity brings to the group totals, every payment of the payments mart
      and every cash-expenditure line of the Dutch budget against outturn, with the span it counts
      in, its basis and the rule that leaves it out (`left_out_by`, null when `group_totals`
      counts it); a counted figure carries its translations. Vendors are not carried. Commitment
      and receipt lines are not figures here.
    columns:
      - name: figure_key
        description: The payment's `payment_key`, or the Dutch line's `budget_line_key`.
        data_tests:
          - unique
          - not_null
      - name: entity_id
        data_tests:
          - not_null
      - name: basis
        description: "{{ doc('group_totals_basis') }}"
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [payments, payments-year-rollup, payments-over-25k, cash-outturn]
      - name: fiscal_year
        description: The figure's fiscal year; null where the calendars do not cover it.
      - name: fiscal_period
        description: The payment's fiscal period; null for a figure with a year and no day.
      - name: period_start
        description: >
          The first day of the span the figure counts in: its fiscal period's, or for a figure
          with a year and no day its fiscal year's; null where the calendars do not cover it.
      - name: period_end
        description: The span's last day.
      - name: payment_date
        description: The payment's day, whose rates translate it at actual rates; null for a figure with a year and no day.
      - name: currency
        description: The entity's own currency.
        data_tests:
          - not_null
      - name: amount
        description: The figure in its own currency as the entity mart serves it; null on a Dutch line of a year with no outturn served.
      - name: left_out_by
        description: "{{ doc('group_totals_left_out_by') }}"
        data_tests:
          - accepted_values:
              arguments:
                values: [repeat, outside-calendars, no-outturn, no-rate]
      - name: reporting_currency
        data_tests:
          - not_null
      - name: amount_at_actual_rates
        description: "{{ doc('group_totals_actual_rates') }} Null on a figure left out."
        data_tests:
          - not_null:
              config:
                where: left_out_by is null
      - name: amount_at_constant_rates
        description: The figure at the rates of `constant_rates_on`, rounded to the cent; null on a figure left out.
        data_tests:
          - not_null:
              config:
                where: left_out_by is null
      - name: constant_rates_on
        data_tests:
          - not_null

unit_tests:
  - name: only_the_rates_change_between_two_periods
    description: >
      Test inputs: the same 1,000 dollars paid by Chicago on 26 March and on 3 April 2024, with
      the real ECB rates of those days and of the constant-rates day. At actual rates the two
      periods differ (921.23 and 927.39 euros), because only the rates changed; at constant rates
      both are 904.98 euros, the dollar's 1.105 per euro on 29 December 2023. The own-currency
      amount is untouched.
    model: group_totals_figures
    overrides:
      vars:
        group_totals: {reporting_currency: EUR, constant_rates_on: "2023-12-29"}
    given:
      - input: ref('payments')
        rows:
          - {payment_key: march, entity_id: chicago, currency: USD, payment_date: 2024-03-26, fiscal_year: 2024, fiscal_period: 3, amount: 1000.00, is_repeat: false}
          - {payment_key: april, entity_id: chicago, currency: USD, payment_date: 2024-04-03, fiscal_year: 2024, fiscal_period: 4, amount: 1000.00, is_repeat: false}
      - input: ref('budget_against_outturn')
        rows: []
      - input: ref('fiscal_periods')
        rows:
          - {entity_id: chicago, fiscal_year: 2024, fiscal_period: 3, period_start: 2024-03-01, period_end: 2024-03-31}
          - {entity_id: chicago, fiscal_year: 2024, fiscal_period: 4, period_start: 2024-04-01, period_end: 2024-04-30}
      - input: ref('fx_published_rates')
        rows:
          - {published_on: 2024-03-01, currency: USD, units_per_euro: 1.0813}
          - {published_on: 2024-03-01, currency: EUR, units_per_euro: 1}
          - {published_on: 2024-03-28, currency: USD, units_per_euro: 1.0811}
          - {published_on: 2024-03-28, currency: EUR, units_per_euro: 1}
          - {published_on: 2024-04-02, currency: USD, units_per_euro: 1.0749}
          - {published_on: 2024-04-02, currency: EUR, units_per_euro: 1}
          - {published_on: 2024-04-30, currency: USD, units_per_euro: 1.0718}
          - {published_on: 2024-04-30, currency: EUR, units_per_euro: 1}
      - input: ref('fx_rates')
        rows:
          - {rate_on: 2024-03-26, currency: USD, units_per_euro: 1.0855, published_on: 2024-03-26}
          - {rate_on: 2024-03-26, currency: EUR, units_per_euro: 1, published_on: 2024-03-26}
          - {rate_on: 2024-04-03, currency: USD, units_per_euro: 1.0783, published_on: 2024-04-03}
          - {rate_on: 2024-04-03, currency: EUR, units_per_euro: 1, published_on: 2024-04-03}
          - {rate_on: 2023-12-29, currency: USD, units_per_euro: 1.105, published_on: 2023-12-29}
          - {rate_on: 2023-12-29, currency: EUR, units_per_euro: 1, published_on: 2023-12-29}
    expect:
      rows:
        - {figure_key: march, amount: 1000.00, left_out_by: null, amount_at_actual_rates: 921.23, amount_at_constant_rates: 904.98}
        - {figure_key: april, amount: 1000.00, left_out_by: null, amount_at_actual_rates: 927.39, amount_at_constant_rates: 904.98}

  - name: a_figure_with_a_year_and_no_day_takes_the_years_average_rate
    description: >
      Test inputs: a Chicago payment the City serves only as a 2023 total and a Dutch 2023 cash
      outturn line, each 1,000 in its currency, with three of 2023's real ECB publications
      standing for the year. Both count in the whole fiscal year, with no period; the dollars
      take the mean of the year's published dollar rates, 1.086633 to six places, so 920.27
      euros, the euros stay 1,000.00, and at constant rates the dollars are 904.98 euros.
    model: group_totals_figures
    overrides:
      vars:
        group_totals: {reporting_currency: EUR, constant_rates_on: "2023-12-29"}
    given:
      - input: ref('payments')
        rows:
          - {payment_key: rolled-up, entity_id: chicago, currency: USD, payment_date: null, fiscal_year: 2023, fiscal_period: null, amount: 1000.00, is_repeat: false}
      - input: ref('budget_against_outturn')
        rows:
          - {budget_line_key: outturn, entity_id: nl-government, currency: EUR, fiscal_year: 2023, kind: U, outturn_eur: 1000.00}
          - {budget_line_key: commitments, entity_id: nl-government, currency: EUR, fiscal_year: 2023, kind: V, outturn_eur: 5000.00}
      - input: ref('fiscal_periods')
        rows:
          - {entity_id: chicago, fiscal_year: 2023, fiscal_period: 1, period_start: 2023-01-01, period_end: 2023-01-31}
          - {entity_id: chicago, fiscal_year: 2023, fiscal_period: 12, period_start: 2023-12-01, period_end: 2023-12-31}
          - {entity_id: nl-government, fiscal_year: 2023, fiscal_period: 1, period_start: 2023-01-01, period_end: 2023-01-31}
          - {entity_id: nl-government, fiscal_year: 2023, fiscal_period: 12, period_start: 2023-12-01, period_end: 2023-12-31}
      - input: ref('fx_published_rates')
        rows:
          - {published_on: 2023-01-02, currency: USD, units_per_euro: 1.0683}
          - {published_on: 2023-01-02, currency: EUR, units_per_euro: 1}
          - {published_on: 2023-06-30, currency: USD, units_per_euro: 1.0866}
          - {published_on: 2023-06-30, currency: EUR, units_per_euro: 1}
          - {published_on: 2023-12-29, currency: USD, units_per_euro: 1.105}
          - {published_on: 2023-12-29, currency: EUR, units_per_euro: 1}
      - input: ref('fx_rates')
        rows:
          - {rate_on: 2023-12-29, currency: USD, units_per_euro: 1.105, published_on: 2023-12-29}
          - {rate_on: 2023-12-29, currency: EUR, units_per_euro: 1, published_on: 2023-12-29}
    expect:
      rows:
        - {figure_key: rolled-up, basis: payments-year-rollup, fiscal_period: null, period_start: 2023-01-01, period_end: 2023-12-31, left_out_by: null, amount_at_actual_rates: 920.27, amount_at_constant_rates: 904.98}
        - {figure_key: outturn, basis: cash-outturn, fiscal_period: null, period_start: 2023-01-01, period_end: 2023-12-31, left_out_by: null, amount_at_actual_rates: 1000.00, amount_at_constant_rates: 1000.00}

  - name: each_rule_leaves_its_figures_out_and_untranslated
    description: >
      Test inputs, one figure per rule beside one that counts: a payment served again, a payment
      of 2022 and the rolled-up row of 1996 to 2002 (years the calendars do not cover), a Dutch
      line of a year with no outturn served, and a May 2024 payment, a month with no ECB rates
      given. Each is left out by its rule with no translation; the March payment counts.
    model: group_totals_figures
    overrides:
      vars:
        group_totals: {reporting_currency: EUR, constant_rates_on: "2023-12-29"}
    given:
      - input: ref('payments')
        rows:
          - {payment_key: counted, entity_id: chicago, currency: USD, payment_date: 2024-03-26, fiscal_year: 2024, fiscal_period: 3, amount: 250.50, is_repeat: false}
          - {payment_key: served-again, entity_id: chicago, currency: USD, payment_date: 2024-03-26, fiscal_year: 2024, fiscal_period: 3, amount: 250.50, is_repeat: true}
          - {payment_key: in-2022, entity_id: chicago, currency: USD, payment_date: 2022-12-30, fiscal_year: null, fiscal_period: null, amount: 10.00, is_repeat: false}
          - {payment_key: rolled-up-2002, entity_id: chicago, currency: USD, payment_date: null, fiscal_year: null, fiscal_period: null, amount: 20.00, is_repeat: false}
          - {payment_key: in-may, entity_id: chicago, currency: USD, payment_date: 2024-05-15, fiscal_year: 2024, fiscal_period: 5, amount: 30.00, is_repeat: false}
      - input: ref('budget_against_outturn')
        rows:
          - {budget_line_key: no-outturn, entity_id: nl-government, currency: EUR, fiscal_year: 2026, kind: U, outturn_eur: null}
      - input: ref('fiscal_periods')
        rows:
          - {entity_id: chicago, fiscal_year: 2024, fiscal_period: 3, period_start: 2024-03-01, period_end: 2024-03-31}
          - {entity_id: chicago, fiscal_year: 2024, fiscal_period: 5, period_start: 2024-05-01, period_end: 2024-05-31}
          - {entity_id: nl-government, fiscal_year: 2026, fiscal_period: 1, period_start: 2026-01-01, period_end: 2026-01-31}
          - {entity_id: nl-government, fiscal_year: 2026, fiscal_period: 12, period_start: 2026-12-01, period_end: 2026-12-31}
      - input: ref('fx_published_rates')
        rows:
          - {published_on: 2024-03-01, currency: USD, units_per_euro: 1.0813}
          - {published_on: 2024-03-01, currency: EUR, units_per_euro: 1}
          - {published_on: 2024-03-28, currency: USD, units_per_euro: 1.0811}
          - {published_on: 2024-03-28, currency: EUR, units_per_euro: 1}
      - input: ref('fx_rates')
        rows:
          - {rate_on: 2024-03-26, currency: USD, units_per_euro: 1.0855, published_on: 2024-03-26}
          - {rate_on: 2024-03-26, currency: EUR, units_per_euro: 1, published_on: 2024-03-26}
          - {rate_on: 2023-12-29, currency: USD, units_per_euro: 1.105, published_on: 2023-12-29}
          - {rate_on: 2023-12-29, currency: EUR, units_per_euro: 1, published_on: 2023-12-29}
    expect:
      rows:
        - {figure_key: counted, left_out_by: null, amount_at_actual_rates: 230.77}
        - {figure_key: served-again, left_out_by: repeat, amount_at_actual_rates: null}
        - {figure_key: in-2022, left_out_by: outside-calendars, amount_at_actual_rates: null}
        - {figure_key: rolled-up-2002, left_out_by: outside-calendars, amount_at_actual_rates: null}
        - {figure_key: in-may, left_out_by: no-rate, amount_at_actual_rates: null}
        - {figure_key: no-outturn, left_out_by: no-outturn, amount_at_actual_rates: null}

  - name: a_span_sums_its_counted_figures_only
    description: >
      Test inputs: two counted payments of one Chicago period, one of them a refund, and one left
      out as a repeat: the row sums the two counted ones in dollars and in euros, and the one
      left out is in no row.
    model: group_totals
    given:
      - input: ref('group_totals_figures')
        rows:
          - {figure_key: a, entity_id: chicago, basis: payments, fiscal_year: 2024, fiscal_period: 3, period_start: 2024-03-01, period_end: 2024-03-31, currency: USD, amount: 250.50, left_out_by: null, reporting_currency: EUR, amount_at_actual_rates: 230.77, amount_at_constant_rates: 226.70, constant_rates_on: 2023-12-29}
          - {figure_key: b, entity_id: chicago, basis: payments, fiscal_year: 2024, fiscal_period: 3, period_start: 2024-03-01, period_end: 2024-03-31, currency: USD, amount: -40.00, left_out_by: null, reporting_currency: EUR, amount_at_actual_rates: -36.85, amount_at_constant_rates: -36.20, constant_rates_on: 2023-12-29}
          - {figure_key: c, entity_id: chicago, basis: payments, fiscal_year: 2024, fiscal_period: 3, period_start: 2024-03-01, period_end: 2024-03-31, currency: USD, amount: 250.50, left_out_by: repeat, reporting_currency: EUR, amount_at_actual_rates: null, amount_at_constant_rates: null, constant_rates_on: 2023-12-29}
    expect:
      rows:
        - {group_total_key: chicago-2024-3-payments, figures: 2, amount: 210.50, amount_at_actual_rates: 193.92, amount_at_constant_rates: 190.50}
