models:
  - name: int_chicago__contract_revisions
    description: >
      One row per contract and revision of the City of Chicago's contracts: the original award or
      one change to it. A revision the publisher serves on several rows counts once: 41 on the
      pinned files, all with one amount and day, 31 of them under two vendor names and 10 under
      one (4 exact repeats, the rest differing by vendor id, department or another column); rows
      of one revision that disagree on the amount or the day would make two rows here, which the
      unique test refuses.
    data_tests:
      - unique:
          arguments:
            column_name: "contract_number || '|' || revision_number"
    columns:
      - name: contract_number
        description: The contract number, as served.
        data_tests:
          - not_null
      - name: revision_number
        description: >
          `0` for the original award, a number for a later revision, or the legacy system's
          document number of a modification or time extension, as served.
        data_tests:
          - not_null
      - name: award_amount
        description: The US dollars the revision adds to the award; negative when it takes money off.
      - name: approved_on
        description: The day the revision was approved.
      - name: served_rows
        description: How many landed rows serve this revision (more than one on a repeated revision).

  - name: int_chicago__contracts
    description: >
      One row per contract of the City of Chicago, with its award after revisions and what the
      reconciliation reads about its revisions.
    columns:
      - name: contract_number
        description: The contract number, as served.
        data_tests:
          - unique
          - not_null
      - name: award_after_revisions
        description: >
          The US dollars awarded once every revision is applied: the sum of the original award and
          each revision's amount, each revision counted once, since every row of the contracts
          table is a change to the award, not a new total (the publisher marks reductions by
          negative amounts, and paid totals match the sum to the cent, not the latest row). A
          revision whose number is not a number (`C514026`) is a modification from the legacy
          system and counts like any other. An award of 0 is not a break: a blanket contract
          awarded $0 "depends upon requirements" (the City's description), with no fixed award
          (5,328 contracts on the pinned files, 2,125 of them paid $2.73bn in all); 28 contracts
          have a negative award, their reductions exceeding what the rows served award.
        data_tests:
          - not_null
      - name: revision_count
        description: How many revisions the contract has, its original award included.
      - name: negative_revision_count
        description: How many of them take money off the award.
      - name: first_approved_on
        description: The day the first of them was approved.
      - name: last_approved_on
        description: The day the latest of them was approved.
      - name: last_ends_on
        description: >
          The latest end date any row of the contract serves, as served (some lie centuries
          ahead); null when no row serves one.

  - name: int_chicago__payments
    description: >
      One row per payment of the City of Chicago, in the payments mart's columns and order
      (described on the mart), then the City's own detail. Payments join their contract on the
      served contract number against one row per contract, so the join repeats no payment.
    columns:
      - name: payment_key
        description: "{{ doc('payment_key') }}"
      - name: entity_id
        description: "{{ doc('payment_entity_id') }}"
      - name: currency
        description: "{{ doc('payment_currency') }}"
      - name: payment_date
        description: "{{ doc('payment_date') }}"
      - name: fiscal_year
        description: "{{ doc('payment_fiscal_year') }}"
      - name: fiscal_period
        description: "{{ doc('payment_fiscal_period') }}"
      - name: amount
        description: "{{ doc('payment_amount') }}"
      - name: vendor_name
        description: "{{ doc('payment_vendor_name') }}"
      - name: vendor_is_hashed
        description: "{{ doc('payment_vendor_is_hashed') }}"
      - name: document_number
        description: "{{ doc('payment_document_number') }}"
      - name: contract_number
        description: "{{ doc('payment_contract_number') }}"
      - name: award_after_revisions
        description: "{{ doc('payment_award_after_revisions') }}"
      - name: source_table
        description: "{{ doc('payment_source_table') }}"
      - name: is_repeat
        description: "{{ doc('payment_is_repeat') }}"
      - name: repeat_kind
        description: >
          Why a row is a repeat, null on a first row: `exact`, a copy after the first of rows
          identical in every column (2,560 rows on the pinned files); `without_department`, a row
          with no department beside an otherwise identical row that has one (7,300);
          `without_department_other_name`, a row with no department beside a row that has one
          and is the same in voucher, amount, day or year and contract but for the vendor name, so
          the City serves one payment under two names of its vendor, a spelling (`ACME INC`,
          `ACME, INC.`) or an old and a new company name (3,982 rows, $3.04bn); or
          `rolled_up_itemised`, a rolled-up year whose amount equals to the cent the unflagged
          dated payments of its vendor, contract and year (1). Two rows the same but for the
          vendor name, neither with a department, are not flagged (1,194 groups on contracts):
          nothing beside the name pairs them, and a wrong flag would drop a real payment from
          every total.
        data_tests:
          - accepted_values:
              arguments:
                values: [exact, without_department, without_department_other_name, rolled_up_itemised]
      - name: is_rolled_up
        description: >
          True on a row the publisher rolled up: the payments of one vendor, contract and year in
          one amount, with no day and no voucher.
      - name: rolled_up_year
        description: >
          The year a rolled-up row covers, as served; 2002 holds every payment from 1996 to 2002.
          Null on an itemised payment.
      - name: department_name
        description: The City department that paid, where served.

unit_tests:
  - name: the_2002_row_takes_no_fiscal_year_whatever_the_calendars_cover
    description: >
      Real rolled-up rows of 2002 (which holds 1996 to 2002) and 2003, against calendars that cover
      both years: 2003 is exactly the fiscal year 2003, while the 2002 row spans seven fiscal years
      and takes none, so no calendar ever counts 1996 to 2002 as 2002.
    model: int_chicago__payments
    given:
      - input: ref('stg_chicago__payments')
        rows:
          - {payment_key: kone-2002, amount: 1600, rolled_up_year: 2002, department_name: DEPT OF GENERAL SERVICES, contract_number: E010532, vendor_name: KONE INC., vendor_is_hashed: false, copy_number: 1}
          - {payment_key: urs-2003, amount: 21574.54, rolled_up_year: 2003, contract_number: T26417, vendor_name: URS CORPORATION, vendor_is_hashed: false, copy_number: 1}
      - input: ref('fiscal_periods')
        rows:
          - {entity_id: chicago, fiscal_year: 2002, fiscal_period: 1, period_start: 2002-01-01, period_end: 2002-01-31}
          - {entity_id: chicago, fiscal_year: 2002, fiscal_period: 12, period_start: 2002-12-01, period_end: 2002-12-31}
          - {entity_id: chicago, fiscal_year: 2003, fiscal_period: 1, period_start: 2003-01-01, period_end: 2003-01-31}
          - {entity_id: chicago, fiscal_year: 2003, fiscal_period: 12, period_start: 2003-12-01, period_end: 2003-12-31}
      - input: ref('fiscal_calendar')
        rows: []
      - input: ref('int_chicago__contracts')
        rows: []
    expect:
      rows:
        - {payment_key: kone-2002, fiscal_year: null, fiscal_period: null, is_repeat: false}
        - {payment_key: urs-2003, fiscal_year: 2003, fiscal_period: null, is_repeat: false}

  - name: a_payment_under_a_second_name_without_a_department_is_a_repeat
    description: >
      Invented rows, labelled as invented: of two rows the same in voucher, amount, day and
      contract but for the vendor name, the one without a department repeats the one with it and
      is flagged; two such rows with no department on either are both kept, since nothing beside
      the name pairs them; and a row with a department under a second name is a payment of its
      own.
    model: int_chicago__payments
    given:
      - input: ref('stg_chicago__payments')
        rows:
          - {payment_key: named, voucher_number: PV1, amount: 100, payment_date: 2025-03-01, department_name: DEPT OF EXAMPLE, contract_number: "1", vendor_name: EXAMPLE A LLC, vendor_is_hashed: false, copy_number: 1}
          - {payment_key: renamed, voucher_number: PV1, amount: 100, payment_date: 2025-03-01, contract_number: "1", vendor_name: "EXAMPLE A, LLC", vendor_is_hashed: false, copy_number: 1}
          - {payment_key: plain, voucher_number: PV2, amount: 200, payment_date: 2025-03-01, contract_number: "1", vendor_name: EXAMPLE A LLC, vendor_is_hashed: false, copy_number: 1}
          - {payment_key: plain-renamed, voucher_number: PV2, amount: 200, payment_date: 2025-03-01, contract_number: "1", vendor_name: "EXAMPLE A, LLC", vendor_is_hashed: false, copy_number: 1}
          - {payment_key: own, voucher_number: PV3, amount: 300, payment_date: 2025-03-01, department_name: DEPT OF EXAMPLE, contract_number: "1", vendor_name: EXAMPLE A LLC, vendor_is_hashed: false, copy_number: 1}
          - {payment_key: own-other, voucher_number: PV3, amount: 300, payment_date: 2025-03-01, department_name: DEPT OF OTHER, contract_number: "1", vendor_name: "EXAMPLE A, LLC", vendor_is_hashed: false, copy_number: 1}
      - input: ref('fiscal_periods')
        rows: []
      - input: ref('fiscal_calendar')
        rows: []
      - input: ref('int_chicago__contracts')
        rows: []
    expect:
      rows:
        - {payment_key: named, is_repeat: false, repeat_kind: null}
        - {payment_key: renamed, is_repeat: true, repeat_kind: without_department_other_name}
        - {payment_key: plain, is_repeat: false, repeat_kind: null}
        - {payment_key: plain-renamed, is_repeat: false, repeat_kind: null}
        - {payment_key: own, is_repeat: false, repeat_kind: null}
        - {payment_key: own-other, is_repeat: false, repeat_kind: null}
