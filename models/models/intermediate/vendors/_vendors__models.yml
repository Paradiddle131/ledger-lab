models:
  - name: vendor_entity
    description: >
      One row per entity and vendor name as landed (Chicago's contract vendors and payees, the UK
      Department for Transport's suppliers): the GLEIF legal entity the name matches, the rule that
      matched it and its score, or why it has none. The rules, first match deciding: `exact`, the
      same matching key as the legal name, in any country (score 1.0); `same_legal_form`, the same
      name before the same legal form however spelt (`Example Limited` and `Example Ltd`, score
      0.9), and `legal_form_dropped`, the same name before any or no legal form (score 0.7), both
      only among legal entities of the entity's own country (the US for Chicago, Great Britain for
      the Department). Of a rule's candidates, those of the entity's own country are preferred,
      then active ones. The name is `matched` only when the preferred candidates are one legal
      entity, `ambiguous` when they are several, `unmatched` when no rule finds one; a hashed name
      is `hashed`, with no rule and no entity. These rules match names already in clear and decide
      nothing about hashing, which the landing alone decides.
    data_tests:
      - unique:
          arguments:
            column_name: "entity_id || '|' || vendor_name"
    columns:
      - name: entity_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [chicago, uk-transport]
      - name: vendor_name
        data_tests:
          - not_null
      - name: match_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [matched, ambiguous, unmatched, hashed]
      - name: match_rule
        data_tests:
          - accepted_values:
              arguments:
                values: [exact, same_legal_form, legal_form_dropped]
      - name: candidate_count
        data_tests:
          - not_null
