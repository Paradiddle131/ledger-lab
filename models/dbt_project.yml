# The layered models. The engine is a profile target (profiles.yml): DuckDB in the session by
# default, BigQuery once the lab project is set; model SQL stays the same on both.
name: ledger_lab
version: "0.0.0"
config-version: 2
profile: ledger_lab

# `../semantics/metricflow` holds the MetricFlow semantic models and metrics, which dbt parses from here into
# the semantic manifest `mf` reads.
model-paths: ["models", "../semantics/metricflow"]
clean-targets: ["target"]

flags:
  send_anonymous_usage_stats: false

# The fiscal years the calendars cover, the same for every entity, each labelled by the calendar
# year it starts in; the period-status seed holds a row for every period of these years.
# The ECB rates (`ecb-rates` in ingest/sources.yaml) start at their first publication of 2023, on
# 2 January, so 1 January 2023, the first day of the calendar-year entities' first fiscal year, has
# no rate: a payment on it that is not a repeat leaves its entity's first period out of the group
# totals whole, as `no-rate` (the Dutch figures have no day). A `first` year before 2023 needs the
# rates' pin moved back with it.
vars:
  fiscal_years:
    first: 2023
    last: 2026
  # Where every model reading a fetched source reads it (the `landed_or_sample` macro): `landed`,
  # the files the fetch kit lands under LEDGER_LAB_LANDING, or `sample`, the committed seeds of
  # real rows the tests pass explicitly.
  source_rows: landed
  # The group totals' reporting currency and the one day whose ECB rates translate every figure
  # at constant rates; the group-totals models and their tests read both from here.
  group_totals:
    reporting_currency: EUR
    constant_rates_on: "2023-12-29"

# On BigQuery every model and seed is built in the profile's dataset, `intermediate` (declared in
# platform/gcp/warehouse.tf), the data products' marts among them: the entity-scoped `payments`
# dataset takes its table only with its row access policies, which the models do not create yet,
# and routing a node to another dataset needs a schema-name macro, which the metric versions gate
# (semantics/versions.py) refuses.
models:
  ledger_lab:
    +materialized: view
    calendars:
      +materialized: table
    intermediate:
      +materialized: table
    reference:
      +materialized: table
    marts:
      +materialized: table
    reconciliations:
      +materialized: table
