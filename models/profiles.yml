# Where the models run, read from the environment; nothing here names a project or an account.
# `local`: an in-process DuckDB file, the default; with no LEDGER_LAB_DUCKDB_PATH, it is
# `models/target/ledger_lab.duckdb` under the folder dbt runs from (the README runs it from the
# repository's root), inside the project's target folder, which dbt makes when it parses the
# project (a build does; `dbt debug` does not).
# `bigquery`: chosen when LEDGER_LAB_GCP_PROJECT is set and the session carries no GCP_PROJECT,
# whose credential is another lab's (`platform/gcp_project.py`); needs `uv sync --group bigquery`;
# every job is capped by maximum_bytes_billed; every model and seed is built in one dataset,
# `intermediate`, which platform/gcp/warehouse.tf declares. In such a session an explicit
# `--target bigquery` names a method dbt refuses when it reads the profile, before any
# connection. Outside such a session, while LEDGER_LAB_BQ_LOCATION, with surrounding whitespace
# trimmed, is not exactly one of the free-tier regions listed in the method line (lower case; unset
# and empty included), the method is another one dbt refuses at the same point; the location dbt
# sends is that trimmed value. A test holds the listed regions equal to the ones the region
# validation in platform/gcp/variables.tf allows; dbt does not read that file. Its credential is Application Default Credentials (`oauth`), or, while
# CLOUDSDK_AUTH_ACCESS_TOKEN is set, that access token (`oauth-secrets`), the one gcloud and bq
# send, which a session whose proxy injects the credential holds as a stand-in the proxy
# replaces; the token is not refreshed.
ledger_lab:
  target: "{{ 'bigquery' if env_var('LEDGER_LAB_GCP_PROJECT', '') | trim and not env_var('GCP_PROJECT', '') else 'local' }}"
  outputs:
    local:
      type: duckdb
      path: "{{ env_var('LEDGER_LAB_DUCKDB_PATH', 'models/target/ledger_lab.duckdb') }}"
      threads: 4
    bigquery:
      type: bigquery
      method: "{{ 'refused-in-another-labs-session' if env_var('GCP_PROJECT', '') else ('refused-outside-the-free-tier-regions' if env_var('LEDGER_LAB_BQ_LOCATION', '') | trim not in ['us-west1', 'us-central1', 'us-east1'] else ('oauth-secrets' if env_var('CLOUDSDK_AUTH_ACCESS_TOKEN', '') else 'oauth')) }}"
      token: "{{ env_var('CLOUDSDK_AUTH_ACCESS_TOKEN', '') }}"
      project: "{{ env_var('LEDGER_LAB_GCP_PROJECT', '') }}"
      dataset: intermediate
      location: "{{ env_var('LEDGER_LAB_BQ_LOCATION', '') | trim }}"
      maximum_bytes_billed: 1000000000
      threads: 4
