# Runs on every budget notification (an Eventarc Pub/Sub event). Below the kill threshold it only
# returns; above it, it unlinks billing from the project it runs in.
main:
  params: [event]
  steps:
    - read:
        assign:
          - notification: ${json.decode(base64.decode(event.data.message.data))}
          - cost: ${double(notification.costAmount)}
          - threshold: ${double(sys.get_env("KILL_THRESHOLD_USD"))}
    - decide:
        switch:
          - condition: ${cost > threshold}
            next: unlink
        next: keep
    - unlink:
        call: googleapis.cloudbilling.v1.projects.updateBillingInfo
        args:
          name: ${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}
          body:
            billingAccountName: ""
        next: unlinked
    - keep:
        return: ${"billing kept; month-to-date cost " + string(cost)}
    - unlinked:
        return: "billing unlinked: the month-to-date cost passed the kill threshold"
