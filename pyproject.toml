[project]
name = "ledger-lab"
version = "0.0.0"
description = "A finance data platform on real public books, with access, metrics and agents under controls that tests prove."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# The BigQuery adapter, installed only where the lab project exists: `uv sync --group bigquery`.
bigquery = [
  "dbt-bigquery==1.12.3",
]
dev = [
  "dbt-core==1.12.7",
  "dbt-duckdb==1.11.1",
  "detect-secrets==1.5.0",
  "jsonschema==4.26.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "pyyaml==6.0.3",
  "ruff==0.17.5",
  "types-pyyaml==6.0.12.20250915",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.pyright]
include = ["tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = ["-q", "--strict-markers", "--strict-config", "-ra"]
testpaths = ["tests"]
xfail_strict = true
