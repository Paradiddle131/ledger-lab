[project]
name = "ledger-lab"
version = "0.0.0"
description = "A finance data platform on real public books, with access, metrics and agents under controls that tests prove."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
# The BigQuery adapter, installed only where the lab project exists: `uv sync --group bigquery`.
bigquery = [
  "dbt-bigquery==1.12.3",
]
dev = [
  "dbt-core==1.12.7",
  "dbt-duckdb==1.11.1",
  "detect-secrets==1.5.0",
  "duckdb==2.0.0",
  "fsspec==2026.9.0",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "python-hcl2==8.2.0",
  "pyyaml==6.0.3",
  "ruff==0.17.5",
  "types-pyyaml==6.0.12.20250915",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.pyright]
include = ["tests", "platform", "access", "ingest"]
extraPaths = ["platform"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# The live stack test needs `make stack-test` to have started this checkout's stack, a landed
# test needs its source landed, a pages test reads publishers' pages over the network, and a tofu
# test needs the pinned OpenTofu initialised (`make fences-validate` runs them), so a plain run
# (and `make check`) leaves all four out; `-m <marker>` on the command line selects them.
addopts = [
  "-q", "--strict-markers", "--strict-config", "-ra", "-m",
  "not stack and not landed and not pages and not tofu",
]
markers = [
  "stack: needs this checkout's running container stack (`make stack-test`)",
  "landed: needs its source landed under the landing path (`python -m ingest.fetch <source>`)",
  "pages: reads the publishers' pages for the pinned files over the network",
  "tofu: has the pinned OpenTofu evaluate platform/gcp after `tofu init` (`make fences-validate`)",
]
testpaths = ["tests"]
# platform/ holds scripts run by path; tests import them as top-level modules.
pythonpath = [".", "platform"]
xfail_strict = true
