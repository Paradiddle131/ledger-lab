[project]
name = "ledger-lab"
version = "0.0.0"
description = "A finance data platform on real public books, with access, metrics and agents under controls that tests prove."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13,<3.14"
# Cedar, the tool policy engine the agent asks in-process (agent/policy/).
dependencies = [
  "cedarpy==4.12.2",
]

[dependency-groups]
# The BigQuery adapter, installed only where the lab project exists: `uv sync --group bigquery`.
bigquery = [
  "dbt-bigquery==1.12.3",
]
# The Data Contract CLI with its DuckDB engine, only for `datacontract test`: the engine needs
# DuckDB 1.5, which conflicts with the project's 2.0 and cannot open the databases dbt builds, so
# it runs in a throwaway environment over a copy written in 1.5's storage format (`make sync`
# fetches it into uv's cache; `uv run --isolated --offline --only-group contract ...`). The CLI
# itself, for `lint` and `breaking`, is in `dev`.
contract = [
  "datacontract-cli[duckdb]==1.2.9",
]
dev = [
  "datacontract-cli==1.2.9",
  "dbt-core==1.12.7",
  "dbt-duckdb==1.11.1",
  "dbt-metricflow==0.15.0",
  "detect-secrets==1.5.0",
  "duckdb==2.0.0",
  "fsspec==2026.9.0",
  "gcsfs==2026.10.1",
  "great-expectations==1.24.1",
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "python-hcl2==8.2.0",
  "pyyaml==6.0.3",
  "rfc8785==0.1.4",
  "sqlglot==30.31.0",
  "ruff==0.17.5",
  "types-pyyaml==6.0.12.20250915",
  "psycopg[binary]==3.2.12",
]

[tool.uv]
package = false
conflicts = [[{ group = "dev" }, { group = "contract" }]]

[tool.ruff]
line-length = 100
target-version = "py313"
# Folders beside the tree that git does not ignore: an agent's worktrees and settings.
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]

[tool.pyright]
include = ["tests", "platform", "access", "agent", "ingest", "models/contracts", "semantics"]
extraPaths = ["platform"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
# The live stack test needs `make stack-test` to have started this checkout's stack, a landed
# test needs its source landed, a pages test reads publishers' pages over the network, a tofu
# test needs the pinned OpenTofu initialised (`make fences-validate` runs them), the bucket
# test reads the lab's landing bucket, a warehouse test reads the lab's loaded tables, and a
# bigquery_persona test queries BigQuery as each persona, off the cloud proxy
# (`make bigquery-personas`), so a plain run leaves all seven out; `-m <marker>` on the command
# line selects them, as an offline test in tests/access/test_bigquery_personas.py does in a child
# pytest that runs the bigquery_persona test over stubs, so `make check` runs it with no GCP call.
addopts = [
  "-q", "--strict-markers", "--strict-config", "-ra", "-m",
  "not stack and not landed and not pages and not tofu and not bucket and not warehouse and not bigquery_persona",
]
markers = [
  "stack: needs this checkout's running container stack (`make stack-test`)",
  "landed: needs its source landed under the landing path (`python -m ingest.fetch <source>`)",
  "pages: reads the publishers' pages for the pinned files over the network",
  "tofu: has the pinned OpenTofu evaluate platform/gcp after `tofu init` (`make fences-validate`)",
  "bucket: lists the lab's landing bucket and compares it with the local landing, reading only",
  "warehouse: reads the lab's `landed` tables and compares them with the local landing, by capped queries",
  "bigquery_persona: queries BigQuery as each persona by an impersonated token, off the cloud proxy",
]
testpaths = ["tests"]
# platform/ holds scripts run by path; tests import them as top-level modules.
pythonpath = [".", "platform"]
xfail_strict = true
