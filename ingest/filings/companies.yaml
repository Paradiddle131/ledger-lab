# The listed companies whose annual reports the regulator's filings set lands: public company names
# only. Validated by companies.schema.json; `python -m ingest.fetch sec-annual-filings` keeps the
# facts of these companies' annual reports and nothing else.
#
# Each company is a vendor the `vendor_entity` model matched to its own legal entity by the exact or
# same-legal-form rule (never by a dropped legal form), and each legal entity is tied to the
# regulator's company id (CIK) by three published lists, none of them a name:
#   lei -> isin    the legal-entity register's ISIN mapping lists the company's listed share
#                  under its own LEI (GLEIF and ANNA's mapping, read through the register's API);
#   isin -> ticker the SEC's fails-to-deliver files pair the share's CUSIP (the ISIN's middle nine
#                  characters) with its ticker (the second half of September and the first half of
#                  October 2026; OraSure's from the first half of October 2025);
#   ticker -> cik  the SEC's company ticker list.
# The share being the legal entity's own is what keeps out a subsidiary: a vendor that is a listed
# parent's subsidiary has no listed share under its LEI, so it has no chain and is left out, even
# when its parent files (TransUnion's operating LLC matched only by a dropped legal form; Jacobs
# Engineering Group Inc., under whose LEI the mapping lists the share of its parent since a
# holding-company reorganisation, is left out as contradictory evidence).
# The list is every vendor with such a chain that the City paid at least a million dollars, but
# for those whose annual reports are filed outside the first quarters the set pins: Microsoft (year
# end in June, reports in July), Tetra Tech and Maximus (September, reports in November).
# `name` is the legal name as the register records it; the regulator may file under another
# (ShotSpotter, Inc. files as SoundThinking, Inc. since its rename, under the same CIK).
