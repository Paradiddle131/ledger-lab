# Each source the fetch kit downloads: `uv run python -m ingest.fetch <name>`.
# Validated by sources.schema.json. An entry, by name (also the landed file's name):
#   <name>:
#     url: https://...?format=csv       # a fixed file, its query string sent as written; or:
#     query:                            # a live table; fixed parameters (a row limit) in its url
#       url: https://...?$limit=50000
#       order: {<param>: <value>}
#       cut_off: {<param>: <value>}
#     sha256: <SHA-256 of the bytes the publisher serves, undecoded>
#     licence: https://...              # the licence, confirmed on the source's issue
#     publisher: <who publishes it>
#     names_people: false               # true: lands only through the source's step
# A live table is ordered by its content, every column, never by the portal's row id, which the
# City reassigns when it recreates rows; rows that tie on every column are identical bytes.
sources:
  # Chicago's contracts and payments land together as the set chicago, through its step, so neither
  # table's descriptions name a payee the other hashes; neither lands alone.
  # City of Chicago contracts (rsxa-ify5), every row approved by the cut-off. The table is live:
  # a row the City edits changes the bytes, and a re-pin moves the hash.
  chicago-contracts:
    query:
      url: https://data.cityofchicago.org/resource/rsxa-ify5.csv?$limit=500000
      order: {$order: "purchase_order_contract_number, revision_number, specification_number, contract_type, start_date, end_date, approval_date, department, vendor_name, vendor_id, address_1, address_2, city, state, zip, award_amount, procurement_type, contract_pdf, purchase_order_description"}
      cut_off: {$where: "approval_date <= '2026-10-31T23:59:59'"}
    sha256: c17c32c54203ce30b5f67464da2eb59af5cd5a5cdfb3c2d6bac1fd9d34d11e4a  # pragma: allowlist secret
    licence: https://www.chicago.gov/city/en/narr/foia/data_disclaimer.html
    publisher: City of Chicago
    names_people: true
  # City of Chicago payments (s4vu-giwb), every row the portal created by the cut-off. Check dates
  # are text in two forms and payments with old check dates arrive every day, so the cut-off is the
  # portal's row-creation time. The City reloads the whole table when it rolls payments older than
  # two years up by year, and a reload moves the hash.
  chicago-payments:
    query:
      url: https://data.cityofchicago.org/resource/s4vu-giwb.csv?$limit=1000000
      order: {$order: "voucher_number, check_date, amount, contract_number, vendor_name, department_name"}
      cut_off: {$where: ":created_at <= '2026-10-31T23:59:59'"}
    sha256: 840db59a961f62cc2ce514d9359acee13abdd6b16043f3b559d4a962405d8a53  # pragma: allowlist secret
    licence: https://www.chicago.gov/city/en/narr/foia/data_disclaimer.html
    publisher: City of Chicago
    names_people: true
  # The Dutch central government's budget statements (Rijksbegrotingsstaten), every year since
  # 2013 in one fixed file, each article's amounts per budget moment in thousands of euros.
  nl-government-budget:
    url: https://www.rijksfinancien.nl/sites/default/files/bestanden/open_data/Begrotingsstaten_2013-2027.csv
    sha256: f22c12d1cb04787b4e43d575759d35cb3cbe4826c11e78852f54cc66c32cbd84  # pragma: allowlist secret
    licence: https://creativecommons.org/publicdomain/zero/1.0/
    publisher: Ministerie van Financiën
    names_people: false
  # The ECB's daily euro reference rates for the pound and the US dollar, from the first covered
  # year to a fixed end date, as CSV, which carries no generated timestamp: a re-fetch serves the
  # same bytes, and a rate the ECB changed behind the end date shows as a drift. A later end date
  # is a new pin, with a new hash.
  ecb-rates:
    url: https://data-api.ecb.europa.eu/service/data/EXR/D.GBP+USD.EUR.SP00.A?startPeriod=2023-01-01&endPeriod=2026-10-31&format=csvdata&detail=dataonly
    sha256: d1aadebbba9390aa9acda3288e3c766ce28aee2164de7f216e1b2ac37ed22077  # pragma: allowlist secret
    licence: https://www.ecb.europa.eu/home/disclaimer/html/index.en.html
    publisher: European Central Bank
    names_people: false
  # The GLEIF register's golden copy published 2026-11-01 00:00 UTC (LEI-CDF 3.1, every record in
  # the world, 507,213,646 bytes): a dated file the publisher writes once and keeps serving, so a
  # re-fetch verifies; a re-pin is a later dated file and moves the hash. Its step keeps the
  # vendors' countries and leaves out what may name a person. The kit holds the whole response in
  # memory under its 512 MiB cap, and the newest file grows about 4 MB a month, so a re-pin to a
  # file past the cap needs the download streamed through the step instead of held whole, not a
  # raised cap.
  gleif-legal-entities:
    url: https://goldencopy.gleif.org/storage/golden-copy-files/2026/11/01/1295525/20261101-0000-gleif-goldencopy-lei2-golden-copy.csv.zip
    sha256: 478014c91f99cab99e3d01f503aacdc7d0b0557173dfc1d0e5613230678dc325  # pragma: allowlist secret
    licence: https://www.gleif.org/en/meta/lei-data-terms-of-use
    publisher: GLEIF
    names_people: true
  # The Department for Transport's spending over £25,000, one file a month of fiscal year 2025
  # (April 2025 to March 2026), landed together as the set uk-transport-spend-2025 through its
  # step; no month lands alone. GOV.UK keeps each file at its media URL; a month the Department
